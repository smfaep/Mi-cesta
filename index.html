/* ============ Utilidades ============ */
function findCat(name){
  const k=norm(name); const tries=[k,k+"s",k+"es",k.replace(/es$/,""),k.replace(/s$/,"")];
  for(const t of tries){ const c=CAT_BY.get(t); if(c) return c; }
  return null;
}
function normUnit(u){
  if(!u) return ""; u=u.toLowerCase().replace(/\.$/,"");
  if(/^gr?s?$|^gramos?$/.test(u)) return "g";
  if(/^(kg|kilos?)$/.test(u)) return "kg";
  if(/^(l|litros?)$/.test(u)) return "L";
  if(u==="ml") return "ml";
  if(/^(uds?|unidad(es)?)$/.test(u)) return "unidades";
  if(/^bri[c]?ks?$/.test(u)) return "brik";
  const map={lata:"latas",botella:"botellas",paquetes:"paquete",packs:"pack",docenas:"docena",bolsas:"bolsa",barra:"barras",rollo:"rollos",botes:"bote",bandejas:"bandeja",cucharada:"cucharadas",diente:"dientes",taza:"tazas"};
  return map[u]||u;
}
const UNIT_RE="(kg|kilos?|gramos?|grs?|g|litros?|l|ml|uds?|unidad(?:es)?|latas?|botellas?|paquetes?|packs?|docenas?|bolsas?|barras?|rollos?|bri[c]?ks?|botes?|bandejas?|cucharadas?|dientes?|tazas?|pizca)";
const numOf=s=>/^medi[oa]$/i.test(s)?0.5:parseFloat(String(s).replace(",","."));
function parseEntry(raw){
  const s=String(raw||"").trim().replace(/\s+/g," "); if(!s) return null;
  let m=s.match(new RegExp("^(\\d+(?:[.,]\\d+)?|medio|media)\\s*"+UNIT_RE+"?\\.?\\s+(?:de\\s+)?(.+)$","i"));
  if(m) return {name:m[3].trim(),qty:numOf(m[1]),unit:normUnit(m[2])};
  m=s.match(new RegExp("^(.+?)\\s+(\\d+(?:[.,]\\d+)?)\\s*"+UNIT_RE+"?$","i"));
  if(m) return {name:m[1].trim(),qty:numOf(m[2]),unit:normUnit(m[3])};
  return {name:s,qty:"",unit:""};
}
function splitEntries(text){
  let parts=String(text||"").split(/[,;\n]+/);
  if(/[,;\n]/.test(text)) parts=parts.flatMap(p=>p.split(/\s+y\s+/i));
  return parts.map(parseEntry).filter(e=>e&&e.name);
}
const prettyName=n=>{const c=findCat(n);return c?c[0]:n.charAt(0).toUpperCase()+n.slice(1);};
function unitFor(q,u){ if(!u) return ""; if(+q!==1) return ["kg","g","L","ml"].includes(u)||/s$/.test(u)?u:u+"s"; if(u==="unidades") return "unidad"; return /[^m]s$/.test(u)?u.slice(0,-1):u; }
function qtyText(q,u){return q?`${fmtN(q,2)}${u?" "+unitFor(q,u):""}`:"";}

async function addEntries(text,target){

  const sid=(target||S.view).spaceId;
  for(const e of entries){ const p=sid?pantryMatch(sid,e.name):null;
    await addItem(p?p.name:e.name,target,entries.length>1,p?{...pantryExtra(p),qty:e.qty,unit:e.unit}:{qty:e.qty,unit:e.unit}); }
  if(entries.length>1) toast(`${entries.length} productos añadidos`);

/* Estadísticas por producto a partir del historial de una lista */
function productStats(listId){
  const st=new Map();
  [...S.purchases.values()].filter(p=>p.listId===listId).forEach(p=>{
    (p.items||[]).forEach(i=>{const k=norm(i.name); const s=st.get(k)||{name:i.name,icon:i.icon,times:[]}; s.times.push(p.at||0); st.set(k,s);});
  });
  st.forEach(s=>s.times.sort((a,b)=>a-b));
  return st;
}
function habitualsHTML(listId,pendKeys){
  const st=[...productStats(listId).values()].filter(s=>!pendKeys.has(norm(s.name))).sort((a,b)=>b.times.length-a.times.length||b.times.at(-1)-a.times.at(-1)).slice(0,10);
  if(!st.length) return "";
  return `<div><p class="label">Lo de siempre</p><div class="chips">${st.map(s=>`<button class="chip" data-pick="${esc(s.name)}"><span>${esc(s.icon||(findCat(s.name)||[])[1]||"🛒")}</span>${esc(s.name)}${s.times.length>1?`<em>${s.times.length}×</em>`:""}</button>`).join("")}</div></div>`;
}
function runningLowHTML(listId,pendKeys){
  const now=Date.now(); const day=864e5; const out=[];
  productStats(listId).forEach(s=>{
    if(s.times.length<2||pendKeys.has(norm(s.name))) return;
    const gaps=[]; for(let k=1;k<s.times.length;k++) gaps.push(s.times[k]-s.times[k-1]);
    const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length; if(avg<day*0.5) return;
    const since=now-s.times.at(-1);
    if(since>=avg*0.9) out.push({...s,avg,since,ratio:since/avg});
  });
  out.sort((a,b)=>b.ratio-a.ratio);
  if(!out.length) return "";
  const d=ms=>{const n=Math.max(1,Math.round(ms/day));return n===1?"1 día":n+" días";};
  return `<div class="low"><p class="label">Puede que se esté acabando</p><ul class="rows soft">${out.slice(0,5).map(s=>simpleRowHTML({name:s.name,icon:s.icon},`data-pick="${esc(s.name)}"`,"Añadir",`Lo compráis cada ~${d(s.avg)} · última vez hace ${d(s.since)}`)).join("")}</ul></div>`;
}

/* ---- Reconocer productos de la despensa al escribir en una lista ---- */
const sing=n=>n.replace(/(?<=[^aeiou])es$/,"").replace(/s$/,"");
function pantryMatch(sid,name){ const n=norm(name); if(!n) return null; const ps=pantryOf(sid);
  return ps.find(p=>norm(p.name)===n)||ps.find(p=>sing(norm(p.name))===sing(n))||null; }
function pantryHits(sid,q){ const n=norm(q); if(!n) return [];
  return pantryOf(sid).map(p=>{ const pn=norm(p.name); const k=pn.indexOf(n); const w=pn.split(/\s+/).some(x=>x.startsWith(n));
      return {p,score:pn===n||sing(pn)===sing(n)?0:pn.startsWith(n)?1:w?2:k>=0?3:-1}; })
    .filter(x=>x.score>=0).sort((a,b)=>a.score-b.score||a.p.name.localeCompare(b.p.name)).map(x=>x.p).slice(0,5); }
function pantryExtra(p){ const d=p.details||{}; const det={marca:d.marca,variedad:d.variedad};
  if(d.photo) det.photo=d.photo; return {pcat:p.pcat||"",icon:p.icon||"",fromPantry:true,details:det}; }
function pantryHitHTML(p,sp,pre,inList){ const st=p.state||"hay"; const d=p.details||{};

/* ---- Deslizar a la izquierda para eliminar (como en el iPhone) ---- */
const SW_OPEN=96;
function closeSwipes(except){ document.querySelectorAll(".row-item.swipe.open").forEach(li=>{ if(li!==except) swipeTo(li,0); }); }
function swipeTo(li,x){ const c=li.querySelector(".sw-content"), b=li.querySelector(".sw-del"); if(!c) return;
  c.style.transform=x?`translateX(${x}px)`:""; b.style.width=Math.max(SW_OPEN,-x)+"px"; li.classList.toggle("open",x<0); }
document.addEventListener("pointerdown",e=>{ const li=e.target.closest&&e.target.closest(".row-item.swipe.open"); closeSwipes(li); },true);
function wireSwipe(root){
  root.querySelectorAll(".row-item.swipe").forEach(li=>{
    const c=li.querySelector(".sw-content");
    let x0=0,y0=0,dx=0,base=0,drag=false,lock=null,pid=null;
    c.addEventListener("pointerdown",e=>{ if(e.pointerType==="mouse"&&e.button!==0) return;
      x0=e.clientX; y0=e.clientY; base=li.classList.contains("open")?-SW_OPEN:0; dx=base; lock=null; drag=true; pid=e.pointerId; });
    c.addEventListener("pointermove",e=>{ if(DRAG){ drag=false; return; } if(!drag||e.pointerId!==pid) return;
      const mx=e.clientX-x0, my=e.clientY-y0;
      if(lock===null){ if(Math.abs(mx)<8&&Math.abs(my)<8) return;
        lock=Math.abs(mx)>Math.abs(my)*1.2?"x":"y";
        if(lock==="x"){ try{c.setPointerCapture(pid);}catch(_){} li.classList.add("dragging"); } }
      if(lock!=="x") return;
      e.preventDefault();
      let x=base+mx; if(x>0) x=x/4; x=Math.max(x,-li.offsetWidth);   // un poco de resistencia hacia la derecha
      dx=x; c.style.transform=`translateX(${x}px)`; li.querySelector(".sw-del").style.width=Math.max(SW_OPEN,-x)+"px"; });
    const end=e=>{ if(!drag||(e&&e.pointerId!==pid)) return; drag=false;
      if(lock!=="x") return;
      li.classList.remove("dragging"); li._swallow=true; setTimeout(()=>li._swallow=false,350);
      const w=li.offsetWidth;
      if(dx<-w*0.55) removeRow(li);
      else if(dx<-SW_OPEN/2) swipeTo(li,-SW_OPEN);
      else swipeTo(li,0); };
    c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
    // Tras arrastrar, o con la fila abierta, un toque no marca el producto: solo cierra
    li.addEventListener("click",ev=>{
      if(ev.target.closest(".sw-del")) return;
      if(li._swallow){ ev.stopPropagation(); ev.preventDefault(); li._swallow=false; return; }   // el «clic» que llega justo después de deslizar
      if(li.classList.contains("open")){ ev.stopPropagation(); ev.preventDefault(); swipeTo(li,0); }
    },true);
    li.querySelector(".sw-del").addEventListener("click",ev=>{ ev.stopPropagation(); removeRow(li); });
  });
}
async function removeRow(li){
  const id=li.dataset.iid; const it=S.items.get(id); if(!it||li.classList.contains("removing")) return;
  const w=li.offsetWidth; li.classList.add("dragging"); swipeTo(li,-w);
  li.style.height=li.offsetHeight+"px"; void li.offsetHeight;
  li.classList.remove("dragging"); li.classList.add("removing"); li.style.height="0px"; li.style.opacity="0";
  const {id:_omit,...data}=it;
  setTimeout(async()=>{ try{ await S.db.doc("items/"+id).delete();
      toastAction(`${it.name} eliminado`,"Deshacer",async()=>{ try{ await S.db.doc("items/"+id).set(data); }catch(x){ err(x); } }); }
    catch(x){ err(x); li.classList.remove("removing"); li.style.height=""; li.style.opacity=""; swipeTo(li,0); } },230);
}


/* ---- Mantener pulsado y arrastrar a otra categoría ---- */
let DRAG=null, dragEndAt=0;
function dragHintHTML(){ let off=false; try{ off=localStorage.getItem("dragHintOff")==="1"; }catch(e){} return off?"":`<p class="drag-hint">Consejo: mantén pulsado un producto y arrástralo a otra categoría.</p>`; }
document.addEventListener("touchmove",e=>{ if(DRAG) e.preventDefault(); },{passive:false});
document.addEventListener("click",e=>{ if(Date.now()-dragEndAt<450){ e.stopPropagation(); e.preventDefault(); } },true);
document.addEventListener("contextmenu",e=>{ if(DRAG||e.target.closest&&e.target.closest(".row-item.swipe,.pantry-row")) e.preventDefault(); });
function wireDragCats(root,kind){
  root.querySelectorAll(kind==="items"?".row-item.swipe":".pantry-row").forEach(li=>{
    const id=kind==="items"?li.dataset.iid:li.dataset.pid; if(!id) return;
    li.addEventListener("pointerdown",e=>{
      if(e.pointerType==="mouse"&&e.button!==0) return;
      if(e.target.closest(".seg,.mini,.sw-del,.r-qty")||li.classList.contains("open")) return;
      const x0=e.clientX, y0=e.clientY, pid=e.pointerId; let lx=x0, ly=y0;
      const off=()=>{ clearTimeout(t); window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",off); window.removeEventListener("pointercancel",off); };
      const mv=ev=>{ if(ev.pointerId!==pid) return; lx=ev.clientX; ly=ev.clientY; if(Math.hypot(lx-x0,ly-y0)>8) off(); };
      const t=setTimeout(()=>{ off(); startDrag(li,kind,id,lx,ly,pid); },450);
      window.addEventListener("pointermove",mv); window.addEventListener("pointerup",off); window.addEventListener("pointercancel",off);
    });
  });
}
function startDrag(li,kind,id,x,y,pid){
  if(DRAG||li.classList.contains("open")||li.classList.contains("dragging")) return;
  const name=(li.querySelector(".r-name")||{}).textContent||""; const ico=li.querySelector(".r-ico,.r-photo");
  const g=document.createElement("div"); g.className="drag-ghost"; g.innerHTML=(ico?ico.outerHTML:"")+`<span>${esc(name)}</span>`; document.body.appendChild(g);
  DRAG={li,kind,id,name,ghost:g,target:null,x,y}; li.classList.add("drag-src"); document.body.classList.add("cat-dragging");
  try{ navigator.vibrate&&navigator.vibrate(15); }catch(e){}
  const mv=e=>{ if(e.pointerId!==pid) return; e.preventDefault(); moveDrag(e.clientX,e.clientY); };
  const up=e=>{ if(e.pointerId!==pid) return; endDrag(e.type==="pointerup"); };
  window.addEventListener("pointermove",mv,{passive:false}); window.addEventListener("pointerup",up); window.addEventListener("pointercancel",up);
  const key=e=>{ if(e.key==="Escape") endDrag(false); }; document.addEventListener("keydown",key);
  DRAG.off=()=>{ window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); window.removeEventListener("pointercancel",up); document.removeEventListener("keydown",key); };
  // Desplazamiento automático cerca de los bordes de la pantalla
  const tick=()=>{ if(!DRAG) return; const m=90;
    if(DRAG.y<m) window.scrollBy(0,-Math.ceil((m-DRAG.y)/6)); else if(DRAG.y>innerHeight-m) window.scrollBy(0,Math.ceil((DRAG.y-(innerHeight-m))/6));
    requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  moveDrag(x,y);
}
function moveDrag(x,y){ if(!DRAG) return; DRAG.x=x; DRAG.y=y;
  DRAG.ghost.style.transform=`translate(${Math.min(x+14,innerWidth-180)}px,${y-22}px)`;
  const el=document.elementFromPoint(x,y); const t=el&&el.closest&&el.closest("[data-dropcat]");
  if(t!==DRAG.target){ if(DRAG.target) DRAG.target.classList.remove("drop-on"); DRAG.target=t; if(t) t.classList.add("drop-on"); } }
async function endDrag(commit){
  if(!DRAG) return; const d=DRAG; DRAG=null; dragEndAt=Date.now();
  d.off(); d.ghost.remove(); d.li.classList.remove("drag-src"); document.body.classList.remove("cat-dragging");
  if(d.target) d.target.classList.remove("drop-on");
  if(!commit||!d.target) return;
  const cid=d.target.dataset.dropcat; const obj=(d.kind==="items"?S.items:S.pantry).get(d.id); if(!obj) return;
  const sp=S.spaces.get(obj.spaceId); if(pcatOf(obj,sp)===cid&&obj.pcat===cid) return;
  const data={pcat:cid}; if(cid.startsWith("d")) data.cat=+cid.slice(1);
  try{ await S.db.doc((d.kind==="items"?"items/":"pantry/")+d.id).update(data);
    const c=pantryCatsOf(sp).find(x=>x.id===cid);
    toast(`${d.name} → ${c?c.emoji+" "+c.name:"otra categoría"}`);
    try{ localStorage.setItem("dragHintOff","1"); }catch(e){} }catch(x){ err(x); }
}

const QTY_STEP={kg:0.5,g:50,L:0.5,ml:250};

/* ============ Writes ============ */
async function addItem(name,target,quiet,extra){
  if(!S.db) return; name=String(name||"").trim().slice(0,60); if(!name) return;
  const v=target||S.view; const c=findCat(name); const finalName=c?c[0]:name.charAt(0).toUpperCase()+name.slice(1);
  const key=norm(finalName); extra=extra||{};
  const existing=itemsOf(v.listId).find(i=>norm(i.name)===key)||[...S.items.values()].find(i=>i.listId===v.listId&&norm(i.name)===norm(name));
  const cat=existing?(existing.cat??10):(c?c[2]:10);
  const lst=S.lists.get(v.listId);
  const mkDet=(old)=>{ const d=Object.assign({},old||{}); if(extra.qty){d.qty=extra.qty;d.unit=extra.unit||"unidades";} if(extra.nota) d.nota=extra.nota;
    if(extra.details) Object.entries(extra.details).forEach(([k,val])=>{ if(val!==""&&val!=null) d[k]=val; });
    if(!d.tienda&&lst&&lst.store) d.tienda=lst.store;
    return d; };
  try{
    if(existing){
      if(!existing.done){
        const upd={}; const other=existing.addedBy&&existing.addedBy!==S.me;
        if(extra.qty||extra.nota||extra.details){
          const d=mkDet(existing.details);
          // Si otra persona pide más de lo mismo, se suman las cantidades
          const od=existing.details||{};
          if(other&&extra.qty&&+od.qty&&(od.unit||"unidades")===(extra.unit||"unidades")) d.qty=Math.round((+od.qty+ +extra.qty)*100)/100;
          upd.details=d; upd.spec=specOf(d);
        }
        if(other){ const also=(existing.alsoBy||[]).filter(a=>a&&a.uid!==S.me);
          also.push({uid:S.me,at:Date.now(),qty:extra.qty||"",unit:extra.qty?(extra.unit||"unidades"):""}); upd.alsoBy=also; }
        if(Object.keys(upd).length) await S.db.doc("items/"+existing.id).update(upd);
        if(!quiet) toast(other?`${existing.name} ya lo había apuntado ${pname(existing.addedBy)}. Te apunto también.`:upd.details?`${existing.name}: actualizado`:`${existing.name} ya está en la lista`);
        return;
      }
      const d=mkDet(existing.details); if(lst&&lst.store&&d.tienda&&d.tienda!==lst.store){ d.tienda=lst.store; delete d.precio; }
      await S.db.doc("items/"+existing.id).update({done:false,checked:false,addedBy:S.me,addedAt:Date.now(),alsoBy:[],details:d,spec:specOf(d)});
    } else {
      const d=mkDet(null);
      const pc=extra.pcat||(!target&&S.view.name==="list"&&S.listFilter&&S.listFilter!=="_none"?S.listFilter:"");
      const cat2=extra.fromPantry&&extra.pcat&&extra.pcat.startsWith("d")?+extra.pcat.slice(1):cat;
      await S.db.collection("items").add({spaceId:v.spaceId,listId:v.listId,name:extra.fromPantry?name:finalName,icon:extra.icon||(c?c[1]:""),cat:cat2,pcat:pc,spec:specOf(d),details:d,done:false,checked:false,addedBy:S.me,addedAt:Date.now(),alsoBy:[]});
    }
  }catch(e){err(e)}
}

async function finishShopping(){
  const l=S.view.listId; const sid=S.view.spaceId; const marked=itemsOf(l).filter(i=>!i.done&&i.checked);
  if(!marked.length) return;
  const b=$("#bFinish"); if(b){b.disabled=true;b.textContent="Guardando…";}
  const lstStore=(S.lists.get(l)||{}).store||"";

      bought.push({name:it.name,icon:it.icon||"",spec:it.details?specOf(d):(it.spec||""),cat:it.cat??10,precio:pi?pi.total:0,unitPrice:pi?pi.price:0,per:pi?pi.per:"",tienda:d.tienda||lstStore,pcat:it.pcat||"",d});

    // Lo comprado pasa a la despensa como «En casa», con su marca, súper y precio
    for(const i of bought){ const p=pantryOf(sid).find(x=>norm(x.name)===norm(i.name)); const d=i.d;
      const keep={}; ["marca","variedad"].forEach(k=>{ if(d[k]!==""&&d[k]!=null) keep[k]=d[k]; });
      keep.tienda=i.tienda||""; keep.lastAt=now;
      if(+i.unitPrice){ keep.precio=i.unitPrice; keep.per=i.per||""; }
      try{ if(p) await S.db.doc("pantry/"+p.id).update({state:"hay",updatedAt:now,by:S.me,details:{...(p.details||{}),...keep},...(d.qty?{qty:d.qty,unit:d.unit||""}:{})});
        else await S.db.collection("pantry").add({spaceId:sid,name:i.name,icon:i.icon,cat:i.cat,pcat:i.pcat||"",state:"hay",qty:d.qty||"",unit:d.unit||"",details:keep,updatedAt:now,by:S.me}); }catch(e){} }
  }
  const sp=S.spaces.get(sid); if(shopperOf(sp)&&sp.shopping.uid===S.me){ try{ await S.db.doc("spaces/"+sid).update({shopping:null}); }catch(e){} }
  if(S.storeMode){ S.storeMode=false; S.mineOnly=false; render(); }
  toast(`Compra finalizada · ${ok} ${ok===1?"producto":"productos"} a la despensa`);
  pruneDone(l);
}
async function pruneDone(listId){
  const done=itemsOf(listId).filter(i=>i.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  for(const old of done.slice(40)){ try{await S.db.doc("items/"+old.id).delete();}catch(e){} }
}

function makeCode(){let s="";const a=new Uint32Array(6);crypto.getRandomValues(a);for(const n of a)s+=CODE_CHARS[n%CODE_CHARS.length];return s;}
async function createSpace({name,emoji,color}){
  if(HAS_FIREBASE) return fbCreateSpace({name,emoji,color});
  let code=makeCode();
  for(let k=0;k<4;k++){ const g=await S.db.doc("invites/"+code).get(); if(!g.exists) break; code=makeCode(); }
  const ref=S.db.collection("spaces").doc();
  await ref.set({name,emoji,color,code,createdBy:S.me,createdAt:Date.now()});
  await S.db.doc("invites/"+code).set({spaceId:ref.id});
  await S.db.doc(`memberships/${ref.id}__${S.me}`).set({spaceId:ref.id,uid:S.me,joinedAt:Date.now(),role:"creator"});
  await S.db.collection("lists").add({spaceId:ref.id,name:"Supermercado",emoji:"🛒",createdAt:Date.now(),createdBy:S.me});
  return ref.id;
}
async function joinByCode(code){
  if(HAS_FIREBASE) return fbJoinByCode(code);
  const g=await S.db.doc("invites/"+code).get();
  if(!g.exists) return {ok:false,msg:"No hay ningún espacio con ese código. Revisa que esté bien escrito."};
  const sid=g.data().spaceId; const sp=await S.db.doc("spaces/"+sid).get();
  if(!sp.exists) return {ok:false,msg:"Ese espacio ya no existe."};
  if(mySpaceIds().has(sid)) return {ok:true,sid,already:true};
  await S.db.doc(`memberships/${sid}__${S.me}`).set({spaceId:sid,uid:S.me,joinedAt:Date.now(),role:"member"});
  return {ok:true,sid};
}
async function deleteSpace(sid){
  if(HAS_FIREBASE) return fbDeleteSpace(sid);
  const sp=S.spaces.get(sid);
  const items=await S.db.collection("items").where("spaceId","==",sid).get();
  for(const d of items.docs) await S.db.doc("items/"+d.id).delete();
  for(const l of listsOf(sid)) await S.db.doc("lists/"+l.id).delete();
  try{ const ps=await S.db.collection("purchases").where("spaceId","==",sid).get(); for(const d of ps.docs) await S.db.doc("purchases/"+d.id).delete(); }catch(e){}
  for(const coll of ["recipes","pantry","prices"]){ try{ const q=await S.db.collection(coll).where("spaceId","==",sid).get(); for(const d of q.docs) await S.db.doc(coll+"/"+d.id).delete(); }catch(e){} }
  try{ await S.db.doc("menus/"+sid).delete(); }catch(e){}
  for(const m of membersOf(sid)) await S.db.doc("memberships/"+m.id).delete();
  if(sp&&sp.code) await S.db.doc("invites/"+sp.code).delete();
  await S.db.doc("spaces/"+sid).delete();
}

function fmtDate(t){
  const d=new Date(t), now=new Date();
  const day=new Date(d.getFullYear(),d.getMonth(),d.getDate()), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diff=Math.round((today-day)/864e5);
  const hm=d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
  if(diff===0) return "Hoy, "+hm;
  if(diff===1) return "Ayer, "+hm;
  const opts=d.getFullYear()===now.getFullYear()?{weekday:"long",day:"numeric",month:"long"}:{day:"numeric",month:"long",year:"numeric"};
  const s=d.toLocaleDateString("es-ES",opts); return s.charAt(0).toUpperCase()+s.slice(1)+", "+hm;
}
async function openHistory(sid,lid){
  const sp=S.spaces.get(sid); if(!sp) return; const col=colorVar(sp.color);
  const allP=[...S.purchases.values()].filter(p=>p.spaceId===sid&&(!lid||p.listId===lid)).sort((a,b)=>(b.at||0)-(a.at||0));
  const ps=allP.slice(0,100);
  await getProfiles(ps.map(p=>p.by).filter(Boolean));
  const title=lid?`Historial · ${esc(S.lists.get(lid)?.name||"")}`:`Historial · ${esc(sp.name)}`;
  const tot=p=>+(p.total??(p.items||[]).reduce((a,i)=>a+(+i.precio||0),0))||0;
  // Gasto por mes (últimos 6)
  const now=new Date(); const months=[];
  for(let k=5;k>=0;k--){ const d=new Date(now.getFullYear(),now.getMonth()-k,1); months.push({y:d.getFullYear(),m:d.getMonth(),label:d.toLocaleDateString("es-ES",{month:"short"}).replace(".",""),sum:0,n:0}); }
  allP.forEach(p=>{const d=new Date(p.at); const mm=months.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth()); if(mm){mm.sum+=tot(p);mm.n++;}});
  const thisM=months[5], prevM=months[4]; const priced=allP.filter(p=>tot(p)>0);
  const avg=priced.length?priced.reduce((a,p)=>a+tot(p),0)/priced.length:0;
  const maxM=Math.max(...months.map(x=>x.sum),1);
  let stats="";
  if(allP.length){
    if(priced.length){
      const diff=prevM.sum?Math.round((thisM.sum-prevM.sum)/prevM.sum*100):null;
      stats=`<div class="spend">
        <div class="kpis">
          <div><span>Este mes</span><strong>${fmtEur(thisM.sum)}</strong>${diff!==null?`<em class="${diff>0?"up":"down"}">${diff>0?"+":""}${diff}% vs. mes pasado</em>`:""}</div>
          <div><span>Mes pasado</span><strong>${fmtEur(prevM.sum)}</strong></div>
          <div><span>Media por compra</span><strong>${fmtEur(avg)}</strong></div>
        </div>
        <div class="bars" role="img" aria-label="Gasto de los últimos 6 meses">${months.map((x,k)=>`<div class="bar${k===5?" now":""}"><span class="bv">${x.sum?fmtN(x.sum)+" €":""}</span><span class="bf" style="height:${Math.max(2,x.sum/maxM*100)}%"></span><span class="bl">${esc(x.label)}</span></div>`).join("")}</div>
        <p class="fine">Calculado con los precios aproximados que pongáis en cada producto.</p>
      </div>`;
    } else stats=`<div class="notice">Pon un <strong>precio aproximado</strong> en la ficha de los productos (lápiz) y aquí verás cuánto gastáis por compra y por mes.</div>`;
  }
  let body="", lastMonth="";
  ps.forEach(p=>{
    const m=new Date(p.at).toLocaleDateString("es-ES",{month:"long",year:"numeric"});
    if(m!==lastMonth){ body+=`<p class="catlabel">${esc(m.charAt(0).toUpperCase()+m.slice(1))}</p>`; lastMonth=m; }
    const n=(p.items||[]).length; const listAlive=S.lists.has(p.listId); const t=tot(p);
    body+=`<details class="purchase">
      <summary>
        <span class="pu-main"><span class="pu-date">${esc(fmtDate(p.at))}</span>
        <span class="pu-meta">${n} ${n===1?"producto":"productos"} · ${esc(pname(p.by))}${!lid&&p.listName?" · "+esc(p.listEmoji||"")+" "+esc(p.listName):""}</span></span>
        ${t?`<span class="pu-total">${fmtEur(t)}</span>`:""}
        <span class="pu-chev" aria-hidden="true"></span>
      </summary>
      <ul class="pu-items">${(p.items||[]).slice().sort(byCat).map(i=>`<li><span class="r-ico">${esc(i.icon||"•")}</span><span class="pu-n">${esc(i.name)}${i.spec?` <em>${esc(i.spec)}</em>`:""}</span>${+i.precio?`<span class="pu-p">${fmtEur(i.precio)}</span>`:""}</li>`).join("")}</ul>
      ${listAlive?`<div class="row pu-actions"><button class="btn quiet" data-again="${esc(p.id)}">${ICON.plus}Añadir todo otra vez a la lista</button></div>`:""}
    </details>`;
  });
  if(!ps.length) body=`<div class="empty"><div style="font-size:36px">🧾</div><p class="e-big">Todavía no hay compras</p><p>Cuando marques productos y pulses «Finalizar compra», la compra aparecerá aquí con su fecha, quién la hizo y lo que costó.</p></div>`;
  const totalItems=ps.reduce((a,p)=>a+(p.items||[]).length,0);
  sheet(col,`<h2>${title}</h2>
    ${ps.length?`<p>${allP.length} ${allP.length===1?"compra":"compras"} · ${totalItems} productos</p>`:""}
    ${stats}
    <div class="history">${body}</div>
    <button class="btn quiet block" id="hClose">Cerrar</button>`,el=>{
      el.querySelector("#hClose").onclick=closeSheet;
      el.querySelectorAll("[data-again]").forEach(b=>b.onclick=async()=>{
        const p=S.purchases.get(b.dataset.again); if(!p) return; b.disabled=true;
        for(const i of p.items||[]) await addItem(i.name,{spaceId:p.spaceId,listId:p.listId},true);
        closeSheet(); toast(`${(p.items||[]).length} productos añadidos a ${S.lists.get(p.listId)?.name||"la lista"}`);
      });
    });
}

function cadHTML(c){ if(!c) return "";

  return `Caduca el ${esc(d.toLocaleDateString("es-ES",{day:"numeric",month:"short"}))}`; }

/* Dónde y a cuánto se compró por última vez un producto */
function lastBought(sid,name){
  const k=norm(catalogName(name)); let best=null;
  S.purchases.forEach(pu=>{ if(pu.spaceId!==sid) return;
    (pu.items||[]).forEach(i=>{ if(norm(catalogName(i.name))===k&&(!best||(pu.at||0)>best.at)) best={at:pu.at||0,store:i.tienda||"",price:+i.unitPrice||0,per:i.per||""}; }); });
  if(!best) return null;
  if(!best.price&&best.store){ const b=bookPrice(sid,name,best.store); if(b){ best.price=+b.price; best.per=b.per||""; } }
  return best.price?best:null;
}

const CAT_EMOJI=["🥦","🥩","🥚","🍞","🥫","🥤","🧊","🧽","🧴","🍼","📦"];
const PCAT_EMOJI=["🧊","🥣","🍝","🍫","🍷","🧂","🍼","🐾","🥗","🍱","🍪","🧃","🫙","🌶️","🧁","🍳","🥜","🏷️"];
/* Todas las categorías activas del espacio: las propias primero y luego las de siempre (editables y borrables) */
function pantryCatsOf(sp){
  const defs=(sp&&sp.catDefs)||{};
  const custom=((sp&&sp.pantryCats)||[]).map(c=>({id:c.id,name:c.name,emoji:c.emoji||"🏷️",custom:true}));
  const base=CATS.map((n,k)=>{ const id="d"+k, o=defs[id]||{}; return o.deleted?null:{id,name:o.name||n,emoji:o.emoji||CAT_EMOJI[k]||"📦",custom:false}; }).filter(Boolean);
  return [...custom,...base];
}
const NONE_CAT={id:"_none",name:"Sin categoría",emoji:"📦"};
function pcatOf(p,sp){
  const ids=new Set(pantryCatsOf(sp).map(c=>c.id));
  if(p.pcat&&ids.has(p.pcat)) return p.pcat;
  const d="d"+(p.cat??10); return ids.has(d)?d:"_none";
}
/* Qué categorías usa cada lista (o la despensa) y en qué orden */
function scopeCfg(sp,scope){
  if(scope&&scope.type==="list"){ const l=S.lists.get(scope.id)||{}; return {order:l.catOrder||[],hidden:l.catHidden||[]}; }
  return {order:(sp&&sp.pantryOrder)||[],hidden:(sp&&sp.pantryHidden)||[]};
}
function orderedCats(sp,scope){
  const all=pantryCatsOf(sp); const {order}=scopeCfg(sp,scope);
  const pos=id=>{ const k=order.indexOf(id); return k<0?1000+all.findIndex(c=>c.id===id):k; };
  return all.slice().sort((a,b)=>pos(a.id)-pos(b.id));
}
function catsFor(sp,scope){ const {hidden}=scopeCfg(sp,scope); return orderedCats(sp,scope).filter(c=>!hidden.includes(c.id)); }
/* Grupo en el que se ve un producto: su categoría si se usa aquí; si no, «Sin categoría» */
function groupOf(p,sp,vis){ const c=pcatOf(p,sp); return vis.has(c)?c:"_none"; }
function catOptionsHTML(sp,scope,curId){

}

        el.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>{ const ids=cats().map(c=>c.id); const k=+b.dataset.down; [ids[k+1],ids[k]]=[ids[k],ids[k+1]]; order=ids; draw(); });
        el.querySelectorAll("[data-cedit]").forEach(b=>b.onclick=async()=>{ try{ await save(); }catch(x){} openPantryCat(sid,b.dataset.cedit,isList?"list":"pantry",()=>openCatConfig(sid,scope)); });
      };

    });

function openPantry(id){
  const p=S.pantry.get(id); if(!p) return; const sp=S.spaces.get(p.spaceId); const col=colorVar(sp.color);
  const base=catalogName(p.name); const cat=p.cat??10; const food=isFood(cat);
  const d=Object.assign({marca:"",variedad:"",tienda:"",precio:"",per:"",nota:"",photo:""},p.details||{});

  const units=[...new Set([...(UNITS[cat]||UNITS[10]),unit0])];
  if(!d.per) d.per=defaultPer(unit0);
  const variants=VARIANTS[base];
  const nu=d.nutr||(NUTR[base]?{kcal:NUTR[base][0],p:NUTR[base][1],c:NUTR[base][2],f:NUTR[base][3]}:{kcal:"",p:"",c:"",f:""});

    </form>`,el=>{
      const q=s=>el.querySelector(s); const num=s=>{const v=q(s)?.value;return v===""||v==null?"":Math.max(0,+v);};
      el.querySelectorAll("#pSt [data-v]").forEach(b=>b.onclick=()=>{ state=b.dataset.v; el.querySelectorAll("#pSt [data-v]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); });
      let autoPrice=null, photo=d.photo||"";

        if(b&&(!pi.value||+pi.value===autoPrice)){ pi.value=b.price; autoPrice=b.price; if(b.per) q("#pPer").value=b.per; } book(); };
      q("#pStore").addEventListener("change",onStore); ["#pPrice","#pPer"].forEach(x=>q(x).addEventListener("input",book));

        const wOn=q("#pWatch").checked;
        const upd={watch:wOn,...(wOn&&!p.watch?{watchAt:Date.now()}:{}),state,qty:num("#pQty"),unit:q("#pUnit").value,caduca:q("#pCad").value||"",details:det,updatedAt:Date.now(),by:S.me};

        if(pc==="__new"){ const nn=q("#pNewCat").value.trim(); pc=nn?await createPantryCat(S.spaces.get(sp.id),nn,"🏷️"):pcatOf(p,sp); }

        await S.db.doc("pantry/"+id).update(upd);
        if(+det.precio){ const prev=bookPrice(sp.id,name,det.tienda||"General");
          if(!prev||+prev.price!==+det.precio||(prev.per||"")!==det.per) await recordPrice(sp.id,name,det.tienda||"General",det.precio,"","",det.per); }
        return det; };
      q("#fPan").onsubmit=async e=>{ e.preventDefault(); try{ const det=await save(); closeSheet(); toast(+det.precio?"Guardado · precio apuntado en la libreta":"Guardado"); }catch(x){ if(x&&x.userMsg) toast(x.userMsg); else err(x); } };
      q("#pToList").onclick=async()=>{ try{ const det=await save(); closeSheet();
        pickList(sp.id,async lid=>{ await addItem(pname2,{spaceId:sp.id,listId:lid},true,{pcat:savedPcat,details:{marca:det.marca,variedad:det.variedad}}); toast(`${pname2} añadido a ${S.lists.get(lid)?.name}`); }); }catch(x){ if(x&&x.userMsg) toast(x.userMsg); else err(x); } };
      q("#pDel").onclick=()=>confirmSheet(col,`¿Quitar «${p.name}» de la despensa?`,"Se borra de la despensa. Su precio sigue guardado en la libreta.","Quitar",async()=>{ await S.db.doc("pantry/"+id).delete(); });
    });
}

/* ============ Menú semanal ============ */
const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DAYS_SHORT=["L","M","X","J","V","S","D"];
const MONTHS=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MEALS=[["comida","Comida"],["cena","Cena"]];
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
const todayIdx=()=>(new Date().getDay()+6)%7;
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const kdate=k=>{ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const today0=()=>{ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); };
const wdOf=d=>(d.getDay()+6)%7;
const dayTitle=k=>{ const d=kdate(k); return `${DAYS[wdOf(d)]} ${d.getDate()}`; };
const dayLong=k=>{ const d=kdate(k); return `${DAYS[wdOf(d)].toLowerCase()} ${d.getDate()} de ${MONTHS[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?" de "+d.getFullYear():""}`; };
const nextDays=()=>{ const t=today0(); return [0,1,2,3,4,5,6].map(i=>dkey(addD(t,i))); };
/* Los 7 bloques fijos, de lunes a domingo: cada uno con la fecha de su próximo día (hoy incluido) */
const weekKeys=()=>{ const t=today0(); const tw=wdOf(t); return [0,1,2,3,4,5,6].map(wd=>dkey(addD(t,(wd-tw+7)%7))); };
/* El plan va por fecha («2026-11-04»). Lo antiguo (por día de la semana) se coloca en la semana actual. */
function menuPlan(){ const m=S.menu||{}; if(m.plan) return m.plan;
  const days=m.days||{}; const plan={}; const mon=addD(today0(),-todayIdx());
  Object.keys(days).forEach(k=>{ const v=days[k]; if(v&&Object.keys(v).length) plan[dkey(addD(mon,+k))]=v; }); return plan; }
const menuHistory=()=>(S.menu&&S.menu.history)||{};
const menuDays=()=>{ const p=menuPlan(); const out={}; nextDays().forEach(k=>{ const wd=wdOf(kdate(k)); if(p[k]) out[wd]=p[k]; }); return out; };
function snapOf(v){ if(!v) return null; if(v.recipeId){ const r=S.recipes.get(v.recipeId); return r?{recipeId:r.id,name:r.name,emoji:r.emoji||"🍲"}:v; } return v.text?{text:v.text}:null; }
async function writeMenu(sid,plan,history){
  try{ await S.db.doc("menus/"+sid).set({spaceId:sid,plan,history,days:{},updatedAt:Date.now()}); }catch(e){err(e)} }
/* Cuando un día pasa, su comida y cena van al historial y el día se queda libre */
let menuArchiving=false, menuArchivedFor="";
async function archiveMenu(sid){
  if(menuArchiving||!S.menu) return; const m=S.menu; const tk=dkey(today0());
  if(menuArchivedFor===sid+"|"+tk&&m.plan&&!Object.keys(m.plan).some(k=>k<tk)) return;
  const plan={...menuPlan()}; const past=Object.keys(plan).filter(k=>k<tk);
  if(!past.length&&m.plan) return;
  const history={...menuHistory()};
  past.forEach(k=>{ const v=plan[k]; const h={...(history[k]||{})}; MEALS.forEach(([ml])=>{ const sn=snapOf(v&&v[ml]); if(sn) h[ml]=sn; }); if(Object.keys(h).length) history[k]=h; delete plan[k]; });
  menuArchiving=true; menuArchivedFor=sid+"|"+tk; try{ await writeMenu(sid,plan,history); } finally{ menuArchiving=false; } }
async function setMenuSlot(sid,day,meal,val){
  const key=typeof day==="number"?nextDays().find(k=>wdOf(kdate(k))===day):day;
  const plan=JSON.parse(JSON.stringify(menuPlan())); plan[key]=plan[key]||{};
  if(val) plan[key][meal]=snapOf(val)||val; else delete plan[key][meal];
  if(!Object.keys(plan[key]).length) delete plan[key];
  await writeMenu(sid,plan,menuHistory()); }
function slotLabel(v){ if(!v) return null; if(v.recipeId){const r=S.recipes.get(v.recipeId); return r?{emoji:r.emoji||"🍲",text:r.name,recipe:true}:v.name?{emoji:v.emoji||"🍲",text:v.name}:{emoji:"❔",text:"Receta borrada"};} return v.text?{emoji:"✏️",text:v.text}:null; }
function monthTitle(keys){ const ds=keys.map(kdate); const a=ds[0], b=ds.at(-1);
  if(a.getMonth()===b.getMonth()) return `${cap(MONTHS[a.getMonth()])} ${a.getFullYear()}`;
  return a.getFullYear()===b.getFullYear()?`${cap(MONTHS[a.getMonth()])} – ${cap(MONTHS[b.getMonth()])} ${b.getFullYear()}`:`${cap(MONTHS[a.getMonth()])} ${a.getFullYear()} – ${cap(MONTHS[b.getMonth()])} ${b.getFullYear()}`; }

/* Lo último que habéis comido, sin repetir, para elegirlo rápido */

/* ---- Calendario: lo que habéis comido cada día, por meses y años ---- */
function openMenuCal(sid,y,m,sel){
  const sp=S.spaces.get(sid); const h=menuHistory(); const plan=menuPlan(); const t=today0(); const tk=dkey(t);
  if(y==null){ y=t.getFullYear(); m=t.getMonth(); }
  const years=[...new Set([t.getFullYear(),...Object.keys(h).map(k=>+k.slice(0,4))])].sort();
  const first=new Date(y,m,1); const nd=new Date(y,m+1,0).getDate(); const pad=wdOf(first);
  const prefix=`${y}-${String(m+1).padStart(2,"0")}-`;
  const monthKeys=Object.keys(h).filter(k=>k.startsWith(prefix));
  const nMeals=monthKeys.reduce((a,k)=>a+MEALS.filter(([ml])=>h[k][ml]).length,0);
  let cells=""; for(let i=0;i<pad;i++) cells+=`<span class="cal-pad"></span>`;
  for(let d=1;d<=nd;d++){ const k=prefix+String(d).padStart(2,"0"); const src=k<tk?h[k]:plan[k];
    const em=src?MEALS.map(([ml])=>{const s=slotLabel(src[ml]); return s?s.emoji:"";}).join(""):"";
    cells+=`<button class="cal-day${src&&em?(k<tk?" has":" plan"):" empty"}${k===tk?" today":""}${k===sel?" sel":""}" data-ck="${k}" aria-label="${esc(dayLong(k))}"><span class="cd-n">${d}</span><span class="cd-e">${esc(em)}</span></button>`; }
  let det="";
  if(sel){ const src=sel<tk?h[sel]:plan[sel]; const rows=MEALS.map(([ml,l])=>{ const v=src&&src[ml]; const s=slotLabel(v);
      return `<div class="cal-meal"><span class="cm-k">${l}</span><span class="cm-v">${s?esc(s.emoji)+" "+esc(s.text):'<span style="color:var(--muted);font-weight:500">Nada apuntado</span>'}</span>${s?`<button class="btn quiet" data-rep="${ml}">↻ Repetir</button>`:""}</div>`; }).join("");
    det=`<div class="cal-det"><h3>${esc(cap(dayLong(sel)))}${sel===tk?" · hoy":sel>tk?" · planificado":""}</h3>${rows}</div>`; }
  sheet(colorVar(sp.color),`<h2>Calendario de comidas</h2>
    ${years.length>1?`<div class="chips cal-years">${years.map(yy=>`<button class="chip ${yy===y?"on":""}" data-cy="${yy}">${yy}</button>`).join("")}</div>`:""}
    <div class="cal-nav"><button data-cm="-1" aria-label="Mes anterior">‹</button><h3>${MONTHS[m]} ${y}</h3><button data-cm="1" aria-label="Mes siguiente">›</button></div>
    <div class="cal-grid">${DAYS_SHORT.map(x=>`<span class="cal-wd">${x}</span>`).join("")}${cells}</div>
    <p class="cal-sum">${nMeals?`${nMeals} ${nMeals===1?"comida registrada":"comidas registradas"} en ${MONTHS[m]}`:`Aún no hay nada registrado en ${MONTHS[m]}`}. Los días que pasan se guardan solos.</p>
    ${det||`<p class="cal-sum">Toca un día para ver qué comisteis y repetirlo.</p>`}
    <button class="btn block" id="calOk">Cerrar</button>`,el=>{
      el.querySelectorAll("[data-cm]").forEach(b=>b.onclick=()=>{ const d=new Date(y,m+ +b.dataset.cm,1); openMenuCal(sid,d.getFullYear(),d.getMonth()); });
      el.querySelectorAll("[data-cy]").forEach(b=>b.onclick=()=>openMenuCal(sid,+b.dataset.cy,m));
      el.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>openMenuCal(sid,y,m,b.dataset.ck===sel?null:b.dataset.ck));
      el.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>{ const src=sel<tk?h[sel]:plan[sel]; openRepeat(sid,src[b.dataset.rep],b.dataset.rep,()=>openMenuCal(sid,y,m,sel)); });
      el.querySelector("#calOk").onclick=()=>closeSheet();
    });
}

/* ============ Fotos ============ */
function compressImage(file,max=380,q=0.72){
  return new Promise((res,rej)=>{const r=new FileReader();
    r.onload=()=>{const img=new Image(); img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q));};
      img.onerror=()=>rej(new Error("img")); img.src=r.result;};
    r.onerror=()=>rej(new Error("read")); r.readAsDataURL(file);});
}

/* ============ Libreta de precios ============ */
const DEFAULT_STORES=["Consum","Mercadona","Lidl","Carrefour","Dia","Mercado"];
const storesOf=sp=>(sp&&Array.isArray(sp.stores)&&sp.stores.length)?sp.stores:DEFAULT_STORES;
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"x";
const priceKey=(sid,name,store)=>`${sid}__${slug(catalogName(name))}__${slug(store)}`;
const pricesFor=(sid,name)=>{ const k=norm(catalogName(name)); return [...S.prices.values()].filter(p=>p.spaceId===sid&&+p.price>0&&norm(catalogName(p.product))===k).sort((a,b)=>a.price-b.price); };
const bookPrice=(sid,name,store)=>store?pricesFor(sid,name).find(p=>p.store===store)||null:null;
/* Mejor precio de la libreta: el del súper preferido; si no, el general; si no, el más reciente de cualquier súper */
function bestBook(sid,name,prefer){
  const ps=pricesFor(sid,name); if(!ps.length) return null;
  for(const st of (prefer||[]).filter(Boolean)){ const b=ps.find(p=>p.store===st); if(b) return b; }
  return ps.find(p=>p.store==="General")||ps.slice().sort((a,b)=>(b.at||0)-(a.at||0))[0];
}
const agoTxt=t=>{const d=Math.floor((Date.now()-t)/864e5); return d<=0?"hoy":d===1?"ayer":d<31?`hace ${d} días`:d<365?`hace ${Math.round(d/30)} ${Math.round(d/30)===1?"mes":"meses"}`:"hace más de un año";};
/* Precio por unidad, kg, 100 g, litro… y cálculo del total de cada producto */
const PER_OPTS=[["unidad","unidad"],["kg","kg"],["100 g","100 g"],["L","litro"],["paquete","paquete"],["botella","botella"],["lata","lata"],["pack","pack"],["docena","docena"]];
const WGT={g:1,kg:1000}, VOL={ml:1,L:1000};
function defaultPer(unit){ return unit in WGT?"kg":unit in VOL?"L":"unidad"; }
function perSelect(id,sel){ return `<select id="${id}">${PER_OPTS.map(([v,l])=>`<option value="${v}" ${v===sel?"selected":""}>${l}</option>`).join("")}</select>`; }
function lineCalc(price,per,qty,unit){
  let mult=1, sub="", short=""; qty=+qty||0;
  if(qty){
    if(per==="kg"&&unit in WGT){ mult=qty*WGT[unit]/1000; sub=`${qtyText(qty,unit)} × ${fmtEur(price)}/kg`; }
    else if(per==="100 g"&&unit in WGT){ mult=qty*WGT[unit]/100; sub=`${qtyText(qty,unit)} × ${fmtEur(price)}/100 g`; }
    else if(per==="L"&&unit in VOL){ mult=qty*VOL[unit]/1000; sub=`${qtyText(qty,unit)} × ${fmtEur(price)}/L`; }
    else if(!(unit in WGT)&&!(unit in VOL)&&(per==="unidad"||unit===per||unitFor(1,unit)===per)){ mult=qty; if(qty!==1) sub=`${fmtN(qty,2)} × ${fmtEur(price)}`; }
  }
  if(["kg","100 g","L"].includes(per)) short=`${fmtEur(price)}/${per}`;
  else if(mult!==1) short=sub;
  if(!sub) sub=short;
  return {total:Math.round(price*mult*100)/100, sub, short};
}
/* Precio de un producto de la lista: el suyo o, si no tiene, el de la libreta */
function priceInfo(i){
  const d=i.details||{}; const lst=S.lists.get(i.listId)||{};
  let price=+d.precio||0, per=d.per, fromBook=false;
  let bookStore="";
  if(!price){ const st=d.tienda||lst.store||""; const b=(st?bookPrice(i.spaceId,i.name,st):null)||bookPrice(i.spaceId,i.name,"General")||(!st?bestBook(i.spaceId,i.name,[]):null);
    if(b){ price=+b.price; per=b.per||defaultPer(b.unit); fromBook=true; bookStore=b.store; } }
  if(!(price>0)) return null;
  per=per||defaultPer(d.unit);
  return {...lineCalc(price,per,d.qty,d.unit),price,per,fromBook,bookStore,listStore:lst.store||""};
}
const storeLabel=s=>s==="General"?"Sin súper":s;
async function recordPrice(sid,name,store,price,qty,unit,per){
  price=+price; if(!(price>0)) return; store=store||"General";
  const id=priceKey(sid,name,store); const ex=S.prices.get(id);
  const last=ex&&ex.history&&ex.history.at(-1);
  const hist=((ex&&ex.history)||[]).concat(last&&last.price===price&&Date.now()-last.at<864e5?[]:[{price,at:Date.now()}]).slice(-8);
  try{ await S.db.doc("prices/"+id).set({spaceId:sid,product:catalogName(name),store,price,qty:qty||"",unit:unit||"",per:per||defaultPer(unit),at:Date.now(),by:S.me,history:hist}); }catch(e){console.warn(e)}
}
function compareHTML(sp,pend){
  if(!pend.length) return "";
  const ico=i=>i.icon||(findCat(i.name)||[])[1]||"🛒";
  const rows=storesOf(sp).map(st=>{ let sum=0; const got=new Map();
    pend.forEach(i=>{ const b=bookPrice(sp.id,i.name,st); if(b){ const d=i.details||{}; const t=lineCalc(+b.price,b.per||defaultPer(b.unit),d.qty,d.unit).total; sum+=t; got.set(i.id,t); } });
    return {st,sum:Math.round(sum*100)/100,n:got.size,got}; }).filter(r=>r.n>0);
  if(!rows.length) return "";
  const maxN=Math.max(...rows.map(r=>r.n)); const full=rows.filter(r=>r.n===maxN);
  const best=full.length>1&&maxN===pend.length?full.reduce((a,b)=>b.sum<a.sum?b:a):null;
  rows.sort((a,b)=>b.n-a.n||a.sum-b.sum);
  // Los dos súper que más productos comparten: comparación justa con los mismos productos
  let pair=null;
  for(let a=0;a<rows.length;a++) for(let b=a+1;b<rows.length;b++){
    const common=pend.filter(i=>rows[a].got.has(i.id)&&rows[b].got.has(i.id));
    if(common.length&&(!pair||common.length>pair.common.length)) pair={A:rows[a],B:rows[b],common}; }
  let fair=null;
  if(pair){ const tA=pair.common.reduce((s,i)=>s+pair.A.got.get(i.id),0), tB=pair.common.reduce((s,i)=>s+pair.B.got.get(i.id),0);
    const win=Math.abs(tA-tB)<0.005?null:tA<tB?pair.A:pair.B; fair={...pair,tA:Math.round(tA*100)/100,tB:Math.round(tB*100)/100,win,dif:Math.round(Math.abs(tA-tB)*100)/100}; }
  const sharedIds=new Set(fair?fair.common.map(i=>i.id):[]);
  // Ahorro producto a producto
  const tips=[]; let save=0;
  pend.forEach(i=>{ const ps=pricesFor(sp.id,i.name).filter(x=>x.store!=="General"); if(ps.length<2) return;
    const mine=(i.details&&i.details.tienda)||(S.lists.get(i.listId)||{}).store; const cur=ps.find(x=>x.store===mine); const cheap=ps[0];
    if(cur&&cheap.store!==cur.store&&cheap.price<cur.price){ const dif=cur.price-cheap.price; save+=dif; tips.push({name:i.name,store:cheap.store,dif}); } });
  tips.sort((a,b)=>b.dif-a.dif);
  const n1=n=>n===1?"1 producto":n+" productos";
  const sub=best?`Más barato: ${esc(best.st)} · ${fmtEur(best.sum)}`
    :fair&&fair.win?`Con los mismos ${n1(fair.common.length)}, ${esc(fair.win.st)} sale ${fmtEur(fair.dif)} más barato`
    :fair?`Con los mismos ${n1(fair.common.length)}, ${esc(fair.A.st)} y ${esc(fair.B.st)} cuestan igual`
    :full.length===1&&rows.length>1?`Solo ${esc(full[0].st)} tiene precio de ${maxN===pend.length?"todo":maxN+" productos"} · ${fmtEur(full[0].sum)}`
    :`${esc(rows[0].st)} · ${fmtEur(rows[0].sum)} (${rows[0].n} de ${pend.length})`;
  const chip=(i,t,cls)=>`<span class="cmp-chip ${cls||""}"><span aria-hidden="true">${esc(ico(i))}</span>${esc(i.name)}${t!=null?` <b>${fmtEur(t)}</b>`:""}</span>`;
  const fairHTML=fair&&!best?`<div class="cmp-fair"><p class="label">Mismos productos en ${esc(fair.A.st)} y ${esc(fair.B.st)}</p>
      <div class="cmp-chips">${fair.common.map(i=>chip(i,null,"both")).join("")}</div>
      <div class="cmp-fair-tot"><span class="${fair.win===fair.A?"win":""}">${esc(fair.A.st)} ${fmtEur(fair.tA)}</span><span class="${fair.win===fair.B?"win":""}">${esc(fair.B.st)} ${fmtEur(fair.tB)}</span></div>
      <p>${fair.win?`En ${fair.common.length===1?"este producto":"estos "+fair.common.length}, <strong>${esc(fair.win.st)}</strong> sale ${fmtEur(fair.dif)} más barato.`:"Cuestan lo mismo en los dos."}</p></div>`:"";
  const rowsHTML=rows.map(r=>{ const have=pend.filter(i=>r.got.has(i.id)), miss=pend.filter(i=>!r.got.has(i.id));
    return `<li class="cmp-li ${best&&r===best?"best":""}"><details class="cmp-st-d"><summary><span class="cmp-st">${esc(r.st)}</span><span class="cmp-cov">${r.n} de ${pend.length} productos</span><strong>${fmtEur(r.sum)}</strong><span class="cmp-mini-chev" aria-hidden="true"></span></summary>
      <div class="cmp-chips">${have.map(i=>chip(i,r.got.get(i.id),sharedIds.has(i.id)?"both":"")).join("")}${miss.map(i=>chip(i,null,"miss")).join("")}</div></details></li>`; }).join("");
  return `<details class="compare"><summary><span><strong>Comparar supermercados</strong><span class="cmp-sub">${sub}${save>0?` · podéis ahorrar ${fmtEur(save)}`:""}</span></span><span class="pu-chev" aria-hidden="true"></span></summary>
    ${fairHTML}
    <ul class="cmp-rows">${rowsHTML}</ul>
    ${rows.length>1||rows.some(r=>r.n<pend.length)?`<div class="cmp-legend"><span style="flex-basis:100%">Toca un súper para ver qué productos cuenta.</span>${sharedIds.size?` <span class="cmp-chip both" style="padding:1px 8px">en los dos</span>`:""}<span class="cmp-chip miss" style="padding:1px 8px">sin precio</span></div>`:""}
    ${tips.length?`<div class="cmp-tips"><p class="label">Dónde ahorrar</p><ul>${tips.slice(0,5).map(t=>`<li><span>${esc(t.name)}</span><span>${fmtEur(t.dif)} menos en <strong>${esc(t.store)}</strong></span></li>`).join("")}</ul></div>`:""}
    <p class="fine">Con los precios de vuestra libreta. Cada súper suma solo los productos que tienen precio guardado allí; para comparar de verdad, mira el recuadro de los mismos productos.</p></details>`;
}

/* Los formularios se manejan por clic/Enter: algunas vistas previas bloquean el envío de formularios */
function wireForms(root){
  root.querySelectorAll("form").forEach(f=>{
    const h=f.onsubmit; if(!h) return; f.onsubmit=null;
    const run=()=>{ if(f.dataset.busy) return; h({preventDefault(){},target:f}); };
    f.addEventListener("submit",e=>{e.preventDefault();run();});
    f.querySelectorAll('button[type="submit"]').forEach(b=>b.addEventListener("click",e=>{e.preventDefault();run();}));
    f.querySelectorAll("input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();run();}}));
  });
}

function sheet(color,html,onMount){
  const root=$("#sheetRoot");
  root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" style="--sc:${color}">${html}</div></div>`;
  $("#scrim").onclick=e=>{if(e.target.id==="scrim")closeSheet();};
  document.onkeydown=e=>{if(e.key==="Escape")closeSheet();};
  onMount&&onMount(root.querySelector(".sheet"));
  wireForms(root);
  const f=root.querySelector("input:not([type=hidden])"); if(f&&window.matchMedia("(min-width:640px)").matches) f.focus();
}
function closeSheet(){$("#sheetRoot").innerHTML="";document.onkeydown=null;}
function pickerHTML(id,opts,sel,kind){
  return `<div class="choices" id="${id}">${opts.map(o=>kind==="color"
    ?`<button type="button" class="swatch" data-v="${o}" aria-label="${o}" aria-pressed="${o===sel}" style="background:var(--s-${o})"></button>`
    :`<button type="button" class="choice" data-v="${o}" aria-pressed="${o===sel}">${o}</button>`).join("")}</div>`;
}
function wirePicker(el,id,onPick){el.querySelectorAll(`#${id} [data-v]`).forEach(b=>b.onclick=()=>{el.querySelectorAll(`#${id} [data-v]`).forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");onPick(b.dataset.v);});}

        if(cur) h+=`<p><strong>Último precio en ${esc(st)}:</strong> ${fmtEur(cur.price)}${cur.qty?` por ${esc(qtyText(cur.qty,cur.unit))}`:""} · ${esc(agoTxt(cur.at))}</p>`;
        else if(st) h+=`<p>Aún no hay precio guardado en ${esc(st)}. Si lo pones, se recordará para la próxima vez.</p>`;
        if(ps.length>1||(ps.length===1&&!cur)) h+=`<div class="pr-stores">${ps.map((x,k)=>`<button type="button" class="pr-chip${k===0&&ps.length>1?" best":""}" data-usest="${esc(x.store)}"><span>${esc(x.store)}</span><strong>${fmtEur(x.price)}</strong></button>`).join("")}</div>`;
        box.innerHTML=h; box.hidden=!h;
        box.querySelectorAll("[data-usest]").forEach(b=>b.onclick=()=>{q("#iStore").value=b.dataset.usest; onStore();});
      };
      const onStore=()=>{ const b=bookPrice(sp.id,it.name,q("#iStore").value); const pi=q("#iPrice");
        if(b&&(!pi.value||+pi.value===autoPrice)){ pi.value=b.price; autoPrice=b.price; if(b.per) q("#iPer").value=b.per; }
        hint(); upd(); };
      q("#iStore").addEventListener("change",onStore); hint();
      q("#iCat").addEventListener("change",()=>{ const nw=q("#iCat").value==="__new"; q("#iNewCatBox").hidden=!nw; if(nw) q("#iNewCat").focus(); });
      ["#iPrice","#iPer","#iQty","#iUnit"].forEach(x=>q(x).addEventListener("input",hint));
      q("#phFile").onchange=async ev=>{const f=ev.target.files&&ev.target.files[0]; if(!f) return;
        try{ photo=await compressImage(f); q("#phPrev").innerHTML=`<img referrerpolicy="no-referrer" src="${photo}" alt="">`; q("#phDel").hidden=false; q('label[for="phFile"]').textContent="Cambiar foto"; }
        catch(x){ toast("No se ha podido leer la imagen. Prueba con otra foto."); } };
      q("#phDel").onclick=()=>{photo=""; q("#phPrev").innerHTML="<span>Sin foto</span>"; q("#phDel").hidden=true; q('label[for="phFile"]').textContent="Añadir foto";};
      q("#fItem").onsubmit=async e=>{e.preventDefault();
        const det={qty:num("#iQty"),unit:q("#iUnit").value,variedad:q("#iVar").value.trim(),marca:q("#iBrand").value.trim(),precio:num("#iPrice"),nota:q("#iNote").value.trim()};
        fields.forEach(f=>{const v=q("#x_"+f.k).value.trim(); if(v&&v!=="Indiferente"&&v!=="No hace falta") det[f.k]=f.n?Math.max(0,+v):v;});
        if(food) det.nutr={kcal:num("#nK"),p:num("#nP"),c:num("#nC"),f:num("#nF")};
        if(photo) det.photo=photo;
        det.tienda=q("#iStore").value||(bookPi&&+det.precio===+bookPi.price&&bookPi.bookStore!=="General"?bookPi.bookStore:""); det.per=q("#iPer").value;
        const n=q("#iName").value.trim()||it.name;
        try{let pc=q("#iCat").value;
          if(pc==="__new"){ const nn=q("#iNewCat").value.trim(); pc=nn?await createPantryCat(S.spaces.get(sp.id),nn,"🏷️"):pcatOf(it,sp); }
          if(pc==="_none") pc=it.pcat||""; const catN=pc.startsWith("d")?+pc.slice(1):(it.cat??10);
          const {id:_omit,...rest}=S.items.get(id)||it; await S.db.doc("items/"+id).set({...rest,name:n,cat:catN,pcat:pc,details:det,spec:specOf(det),assignee:q("#iWho").value||null});if(+det.precio){ const stx=det.tienda||(S.lists.get(it.listId)||{}).store||"General"; const prev=bookPrice(sp.id,n,stx);
          if(!prev||+prev.price!==+det.precio||(prev.per||"")!==det.per) recordPrice(sp.id,n,stx,det.precio,det.qty,det.unit,det.per); } closeSheet();toast("Guardado");}catch(x){err(x)}};
      q("#iDel").onclick=async()=>{try{await S.db.doc("items/"+id).delete();closeSheet();}catch(x){err(x)}};
    });
}

document.documentElement.dataset.skin="cristal-perla";

if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW",e)));
}
boot();
</script>
