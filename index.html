<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Cesta Familiar</title>
<meta name="description" content="La lista de la compra de la familia: espacios compartidos, menú, recetas, despensa y precios.">
<meta name="theme-color" content="#f2f2f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="La Cesta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
/* Layout: one-column app shell (max 760px). Coloured space band on top, tile grid below, bottom sheets for actions. */
:root{
  --bg:#f3f5f1;
  --surface:#ffffff;
  --surface-2:#e8ece5;
  --fg:#1c2420;
  --muted:#5d6a63;
  --line:#d6ddd3;
  --ink-on:#ffffff;
  --accent:#2f6b4f;
  --mustard:#e2a92b;
  --danger:#b4382a;
  --s-verde:#2f6b4f;
  --s-tomate:#c4472f;
  --s-ciruela:#7a3e72;
  --s-mar:#2b5f8a;
  --s-azafran:#a2650f;
  --s-pizarra:#4a5560;
  --shadow:0 1px 2px rgba(28,36,32,.06),0 6px 20px rgba(28,36,32,.07);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614;--surface:#1b211e;--surface-2:#242b27;--fg:#e6ebe7;--muted:#97a49c;--line:#2f3833;--ink-on:#ffffff;
  --accent:#4f9a75;--mustard:#e8b64a;--danger:#e0705f;
  --s-verde:#3a7d5d;--s-tomate:#c9553c;--s-ciruela:#8c4d83;--s-mar:#356e9c;--s-azafran:#a86f1c;--s-pizarra:#5a6672;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614;--surface:#1b211e;--surface-2:#242b27;--fg:#e6ebe7;--muted:#97a49c;--line:#2f3833;--ink-on:#ffffff;
  --accent:#4f9a75;--mustard:#e8b64a;--danger:#e0705f;
  --s-verde:#3a7d5d;--s-tomate:#c9553c;--s-ciruela:#8c4d83;--s-mar:#356e9c;--s-azafran:#a86f1c;--s-pizarra:#5a6672;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--mustard);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Band */
.band{--sc:var(--accent);background:var(--sc);color:var(--ink-on);transition:background .3s}
.band .wrap{padding-block:18px 22px;display:flex;flex-direction:column;gap:14px}
.band-top{display:flex;align-items:center;gap:10px;min-height:40px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:inherit;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.26)}
.iconbtn svg{width:20px;height:20px}
.crumb{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1.02;margin:0;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.band .sub{margin:0;opacity:.88;font-size:14.5px}
.band-actions{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:0;border-radius:999px;padding:9px 15px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);color:inherit}
.pill:hover{background:rgba(255,255,255,.26)}
.pill.solid{background:#fff;color:var(--sc)}
.pill svg{width:17px;height:17px}
.avatars{display:flex;align-items:center}
.avatars img{width:28px;height:28px;border-radius:50%;border:2px solid var(--sc);margin-left:-8px;background:var(--surface-2);object-fit:cover}
.avatars img:first-child{margin-left:0}
.avatars .more{margin-left:6px;font-size:13px;font-weight:600;opacity:.9}

main .wrap{padding-block:20px 120px;display:flex;flex-direction:column;gap:22px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;color:var(--muted);font-size:14px}
.notice strong{color:var(--fg)}

/* Section labels */
.label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.label .count{font-variant-numeric:tabular-nums;background:var(--surface-2);color:var(--fg);border-radius:999px;padding:1px 8px;letter-spacing:0}

/* Space cards */
.spaces{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.space-card{--sc:var(--accent);text-align:left;border:0;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);padding:0;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.space-card .sc-top{background:var(--sc);color:var(--ink-on);padding:16px 16px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:88px}
.space-card .sc-emoji{font-size:34px;line-height:1}
.space-card .sc-name{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;padding:12px 16px 2px;overflow-wrap:anywhere}
.space-card .sc-meta{padding:0 16px 14px;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.space-card .avatars img{border-color:var(--sc)}
.space-card:hover{transform:translateY(-1px)}
.space-card{transition:transform .15s}

/* Lists */
.lists{display:flex;flex-direction:column;gap:10px}
.list-row{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%}
.list-row:hover{border-color:var(--muted)}
.list-row .lr-emoji{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.list-row .lr-body{flex:1;min-width:0}
.list-row .lr-name{font-weight:700;font-size:16.5px;overflow-wrap:anywhere}
.list-row .lr-peek{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .lr-badge{font-variant-numeric:tabular-nums;font-weight:700;min-width:32px;height:32px;padding:0 9px;border-radius:999px;display:grid;place-items:center;background:var(--sc);color:var(--ink-on);flex:none}
.list-row .lr-badge.zero{background:var(--surface-2);color:var(--muted)}

/* Add bar */
.addbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 6px;margin-block:-10px -6px}
.addbox{display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.addbox:focus-within{border-color:var(--sc)}
.addbox input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;font-size:16px;outline:none}
.addbox button{border:0;border-radius:12px;background:var(--sc);color:var(--ink-on);font-weight:700;padding:9px 14px}
.suggest{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.suggest[hidden]{display:none}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tile{position:relative;aspect-ratio:1/1;max-width:100%;border:0;border-radius:14px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;background:var(--sc);color:var(--ink-on);transition:transform .12s, opacity .2s}
.tile:active{transform:scale(.95)}
.tile .t-ico{font-size:34px;line-height:1.05;height:38px;display:grid;place-items:center}
.tile .t-letter{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.tile .t-name{font-weight:600;font-size:13.5px;line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .t-spec{font-size:11.5px;opacity:.85;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.recent{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.tile.recent .t-ico{filter:saturate(.7)}
.tile.ghost{background:var(--surface-2);color:var(--fg);border:1.5px dashed var(--line)}
.tile .t-edit{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:8px;border:0;background:rgba(255,255,255,.18);color:inherit;display:grid;place-items:center;opacity:.85}
.tile.recent .t-edit{background:var(--surface-2)}
.tile .t-edit svg{width:14px;height:14px}
.tile .t-by{position:absolute;top:6px;left:6px;width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);object-fit:cover}
.catlabel{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.catlabel:first-child{margin-top:0}

/* Empty state */
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty .e-big{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--fg);margin:0}
.empty p{margin:0;max-width:42ch}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--sc,var(--accent));color:var(--ink-on);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.quiet{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.linkish{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{--sc:var(--accent);background:var(--surface);color:var(--fg);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:up .2s ease-out}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.01em}
.sheet p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--sc)}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:22px;display:grid;place-items:center}
.choice[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--surface)}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1.5px var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--surface);box-shadow:0 0 0 2.5px var(--fg)}
.invite-box{border:1.5px dashed var(--sc);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.code{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:.14em;font-variant-numeric:tabular-nums;color:var(--sc);user-select:all}
.invite-link{font-size:13px;color:var(--muted);word-break:break-all;user-select:all}
.members{display:flex;flex-direction:column;gap:8px}
.member{display:flex;align-items:center;gap:10px}
.member img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.member span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member em{font-style:normal;font-size:12.5px;color:var(--muted)}
.steps{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-size:14px}


/* Rows */
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rows>li+li{border-top:1px solid var(--line)}
.row-item{display:flex;align-items:center;gap:4px;padding-right:6px;min-height:58px}
.check{flex:none;width:52px;height:58px;border:0;background:none;display:grid;place-items:center;padding:0}
.check svg{width:26px;height:26px;padding:3px;border-radius:8px;border:2px solid var(--line);color:transparent;background:var(--bg);transition:background .15s,border-color .15s,color .15s}
.check:hover svg{border-color:var(--sc)}
.row-item.checked .check svg{background:var(--sc);border-color:var(--sc);color:var(--ink-on)}
.r-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:8px 4px 8px 0}
.r-ico{font-size:24px;width:34px;text-align:center;flex:none;line-height:1}
.r-letter{font-family:var(--f-display);font-weight:800;font-size:18px;width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
.r-text{display:flex;flex-direction:column;min-width:0}
.r-name{font-weight:600;font-size:16px;overflow-wrap:anywhere;transition:color .15s}
.r-spec{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-item.checked .r-name{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.row-item.checked .r-ico{opacity:.45}
.r-by{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none;opacity:.9}
.r-edit{flex:none;width:38px;height:38px;border:0;border-radius:10px;background:none;color:var(--muted);display:grid;place-items:center}
.r-edit:hover{background:var(--surface-2);color:var(--fg)}
.r-edit svg{width:17px;height:17px}
.row-add{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:10px 14px;min-height:52px}
.row-add:hover{background:var(--surface-2)}
.row-add .r-text{flex:1}
.r-plus{font-size:13px;font-weight:700;color:var(--sc,var(--accent));flex:none}
.rows.soft .r-name{font-weight:500}
.suggest{display:block;margin-top:8px}
.suggest .rows{box-shadow:var(--shadow)}
.catlabel{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.label .label-note{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none;font-size:13px;color:var(--sc)}
.finish{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);animation:up .2s ease-out}
.finish-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.finish-txt{color:var(--muted);font-size:14.5px}
.finish .btn{white-space:nowrap}
.finish-txt strong{color:var(--fg);font-variant-numeric:tabular-nums}

.history{display:flex;flex-direction:column;gap:8px}
.history .catlabel:first-child{margin-top:0}
.purchase{border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.purchase summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.purchase summary::-webkit-details-marker{display:none}
.pu-main{flex:1;min-width:0;display:flex;flex-direction:column}
.pu-date{font-weight:700}
.pu-meta{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.pu-chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none;margin-right:4px}
.purchase[open] .pu-chev{transform:rotate(-135deg)}
.pu-items{list-style:none;margin:0;padding:0 14px 6px;display:flex;flex-direction:column}
.pu-items li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.pu-items .r-ico{font-size:19px;width:26px}
.pu-items em{font-style:normal;color:var(--muted);font-size:13px}
.pu-actions{padding:6px 14px 14px}
.pu-actions .btn{font-size:14px;padding:9px 14px}

.item-head{display:flex;gap:14px;align-items:center}
.item-head .item-ico{font-size:40px;width:60px;height:60px;border-radius:16px;background:var(--bg);display:grid;place-items:center;flex:none}
.item-head h2{overflow-wrap:anywhere}
.item-head p{font-size:13.5px}
.item-form{display:flex;flex-direction:column;gap:18px}
.fs{display:flex;flex-direction:column;gap:10px}
.fs .label{margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid4 .field{position:relative}
.grid4 .field input{padding-right:34px}
.grid4 .unit{position:absolute;right:10px;bottom:12px;font-size:12px;color:var(--muted);pointer-events:none}
.nutri-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.nutri-bar:empty{display:none}
.nutri-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.nutri-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.nutri-total{font-size:14px;color:var(--muted)}
.nutri-total strong{color:var(--fg);font-variant-numeric:tabular-nums}
.fine{font-size:12.5px!important;color:var(--muted)}
.label .label-est{font-weight:700;letter-spacing:0;text-transform:none;font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums}

/* Banner de compra */
.shopping-banner{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);border-radius:14px;padding:8px 12px;font-size:14px}
.shopping-banner img{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none}
.shopping-banner span{min-width:0}
.sc-shop{padding:0 16px 14px;margin-top:-6px;font-size:13px;font-weight:600;color:var(--sc)}
/* Pestañas */
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 1 0;min-width:max-content;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
@media (max-width:440px){.tabs{gap:2px;padding:3px}.tabs button{font-size:13px;padding:8px 5px}}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tabdyn{display:flex;flex-direction:column;gap:18px}
#dyn{display:flex;flex-direction:column;gap:22px}
#tabFixed:empty{display:none}
/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:600;font-size:14px}
.chip:hover{border-color:var(--sc,var(--accent))}
.chip em{font-style:normal;color:var(--muted);font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--sc);border-color:var(--sc);color:var(--ink-on)}
.low .rows{border-color:var(--mustard)}
.r-who{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:1px}
.r-who.me{color:var(--sc)}
.r-photo{width:38px;height:38px;border-radius:10px;object-fit:cover;flex:none}
/* Modo tienda */
.store-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:16px;color:var(--muted)}
.store-bar strong{color:var(--fg);font-size:22px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
body.store .row-item{min-height:70px}
body.store .r-name{font-size:20px}
body.store .r-spec{font-size:14.5px}
body.store .check{width:62px;height:70px}
body.store .check svg{width:32px;height:32px}
body.store .r-ico{font-size:30px;width:40px}
body.store .r-photo{width:48px;height:48px}
body.store .band h1{font-size:28px}
body.store .catlabel{font-size:13px}
/* Despensa */
.pantry-row{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 14px;flex-wrap:wrap;min-height:58px}
.pantry-row .r-text{flex:1;min-width:90px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 9px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.st-no .seg button[aria-pressed="true"]{background:var(--danger);color:#fff}
.st-poco .seg button[aria-pressed="true"]{background:var(--mustard);color:#1c2420}
.mini{border:0;border-radius:9px;background:var(--sc);color:var(--ink-on);font-weight:700;font-size:13px;padding:7px 10px;display:inline-flex;align-items:center;gap:4px}
.mini svg{width:14px;height:14px}
.pantry-alert{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--mustard);border-radius:var(--r);padding:12px 14px}
@media (max-width:520px){.pantry-row .seg{order:3;width:100%}.pantry-row .seg button{flex:1}}
/* Recetas */
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.recipes.small{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.recipe-card{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.recipe-card:hover,.recipe-card.sel{border-color:var(--sc)}
.recipe-card.sel{box-shadow:inset 0 0 0 1.5px var(--sc)}
.rc-emoji{font-size:30px}
.rc-name{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.rc-meta{font-size:13px;color:var(--muted)}
.field textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;width:100%;resize:vertical;color:inherit}
.field textarea:focus{outline:none;border-color:var(--sc)}
.steps-txt{white-space:pre-wrap;color:var(--fg)!important}
.pu-items.plain{padding:0}
.tag{font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:2px 8px;white-space:nowrap;margin-left:auto}
.ing{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.ing input{width:20px;height:20px;accent-color:var(--sc);flex:none}
.ing .r-text{flex:1}
/* Menú */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.day.today{border-color:var(--sc);box-shadow:inset 0 0 0 1px var(--sc)}
.day-name{margin:0;font-family:var(--f-display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.day-name span{font-family:var(--f-body);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:var(--sc);color:var(--ink-on);border-radius:999px;padding:2px 8px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{border:1.5px dashed var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:52px}
.slot.filled{border-style:solid;background:var(--surface-2)}
.slot:hover{border-color:var(--sc)}
.slot-meal{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slot-val{font-weight:600;display:flex;gap:6px;overflow-wrap:anywhere}
.slot-empty{color:var(--muted);font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
/* Gasto */
.spend{display:flex;flex-direction:column;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpis div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpis span{font-size:12px;color:var(--muted);font-weight:600}
.kpis strong{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.kpis em{font-style:normal;font-size:12px;font-weight:600}
.kpis em.up{color:var(--danger)} .kpis em.down{color:var(--accent)}
@media (max-width:420px){.kpis strong{font-size:17px}}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:130px;align-items:end;border-bottom:1px solid var(--line);padding-top:16px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;gap:4px}
.bf{width:100%;max-width:38px;background:var(--surface-2);border-radius:6px 6px 0 0;border:1px solid var(--line);border-bottom:0}
.bar.now .bf{background:var(--sc);border-color:var(--sc)}
.bv{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bl{position:absolute;bottom:-20px;font-size:11.5px;color:var(--muted);text-transform:capitalize}
.spend .fine{margin-top:14px!important}
.pu-total{font-weight:700;font-variant-numeric:tabular-nums}
.pu-n{flex:1;min-width:0}
.pu-p{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* Foto */
.photo-box{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.photo-prev{width:110px;height:110px;border-radius:14px;background:var(--bg);border:1.5px dashed var(--line);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted);font-size:13px}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-start;flex:1;min-width:160px}
.photo-actions label.btn{cursor:pointer}

/* Precios */
.price-hint{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px}
.price-hint[hidden]{display:none}
.price-hint p{margin:0}
.price-hint strong{color:var(--fg)}
.pr-stores{display:flex;flex-wrap:wrap;gap:6px}
.pr-chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13.5px}
.pr-chip strong{font-variant-numeric:tabular-nums}
.pr-chip em{font-style:normal;color:var(--muted);font-size:12px}
.pr-chip.best{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.pr-chip.best strong{color:var(--accent)}
.price-tools{display:flex;flex-direction:column;gap:10px}
.price-row{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.pr-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pr-when{font-size:12.5px;color:var(--muted)}
.pr-hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pr-hist li{display:grid;grid-template-columns:1fr auto 90px;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:14px}
.pr-hist em{font-style:normal;font-size:12.5px;text-align:right}
.pr-hist em.up{color:var(--danger)} .pr-hist em.down{color:var(--accent)}
.compare{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.compare summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.compare summary::-webkit-details-marker{display:none}
.compare summary>span:first-child{flex:1;display:flex;flex-direction:column}
.cmp-sub{font-size:13.5px;color:var(--muted)}
.compare[open] .pu-chev{transform:rotate(-135deg)}
.cmp-rows{list-style:none;margin:0;padding:0 14px}
.cmp-rows li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.cmp-st{font-weight:600;flex:1}
.cmp-cov{font-size:12.5px;color:var(--muted)}
.cmp-rows strong{font-variant-numeric:tabular-nums;min-width:72px;text-align:right}
.cmp-rows li.best .cmp-st::after{content:"Más barato";margin-left:8px;font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:999px;padding:2px 7px}
.cmp-tips{padding:4px 14px 6px}
.cmp-tips .label{margin:6px 0}
.cmp-tips ul{list-style:none;margin:0;padding:0}
.cmp-tips li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.cmp-tips li span:last-child{color:var(--muted);text-align:right}
.cmp-tips strong{color:var(--accent)}
.compare .fine{padding:0 14px 12px;margin:0}
.store-list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.store-list li{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 4px 14px;border-top:1px solid var(--line)}
.store-list li:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Cristal: translúcido sobre colores suaves ---------- */
:root[data-skin^="cristal"]{--bg:#f3f6f5;--surface:rgba(255,255,255,.6);--surface-2:rgba(255,255,255,.42);--sheet:#ffffff;--fg:#17202b;--muted:#5d6976;--line:rgba(255,255,255,.75);--accent:#0f9d8a;--mustard:#ff8a65;--danger:#e0505a;--ink-on:#ffffff;
  --m1:#b6efd9;--m2:#ffd4c0;--m3:#d8d0ff;--f-display:"Plus Jakarta Sans","Inter",system-ui,sans-serif;--f-body:"Plus Jakarta Sans","Inter",system-ui,sans-serif;--r:22px;--shadow:0 10px 30px -14px rgba(20,40,40,.25);--fline:rgba(20,30,40,.16)}
@media (prefers-color-scheme:dark){:root[data-skin^="cristal"]:not([data-theme="light"]){--bg:#0e1316;--surface:rgba(34,44,50,.58);--surface-2:rgba(44,56,64,.48);--sheet:#182126;--fg:#eef4f3;--muted:#9fb1b6;--line:rgba(255,255,255,.12);--accent:#3fd6bf;--m1:#0b3b33;--m2:#4a2a20;--m3:#2a2552;--fline:rgba(255,255,255,.16)}}
:root[data-skin^="cristal"][data-theme="dark"]{--bg:#0e1316;--surface:rgba(34,44,50,.58);--surface-2:rgba(44,56,64,.48);--sheet:#182126;--fg:#eef4f3;--muted:#9fb1b6;--line:rgba(255,255,255,.12);--accent:#3fd6bf;--m1:#0b3b33;--m2:#4a2a20;--m3:#2a2552;--fline:rgba(255,255,255,.16)}
[data-skin^="cristal"] body{background:radial-gradient(at 12% 8%,var(--m1) 0,transparent 45%),radial-gradient(at 88% 18%,var(--m2) 0,transparent 45%),radial-gradient(at 55% 88%,var(--m3) 0,transparent 50%),var(--bg);background-attachment:fixed}
[data-skin^="cristal"] .band{background:transparent!important;color:var(--fg)}
[data-skin^="cristal"] .band h1{font-weight:800;letter-spacing:-.03em}
[data-skin^="cristal"] .iconbtn,[data-skin^="cristal"] .pill,[data-skin^="cristal"] .shopping-banner{background:var(--surface);color:var(--fg);border:1px solid var(--line);backdrop-filter:blur(14px)}
[data-skin^="cristal"] .pill.solid{background:var(--accent);color:#fff;border-color:transparent}
[data-skin^="cristal"] .avatars img{border-color:var(--line)}
[data-skin^="cristal"] .rows,[data-skin^="cristal"] .list-row,[data-skin^="cristal"] .space-card,[data-skin^="cristal"] .addbox,[data-skin^="cristal"] .tabs,[data-skin^="cristal"] .compare,[data-skin^="cristal"] .day,[data-skin^="cristal"] .recipe-card,[data-skin^="cristal"] .chip,[data-skin^="cristal"] .notice,[data-skin^="cristal"] .empty,[data-skin^="cristal"] .pantry-alert{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow)}
[data-skin^="cristal"] .rows>li+li{border-top:1px solid var(--line)}
[data-skin^="cristal"] .addbar{background:transparent}
[data-skin^="cristal"] .check svg{border-radius:50%;background:transparent;border-color:var(--muted)}
[data-skin^="cristal"] .row-item.checked .check svg{background:var(--accent);border-color:var(--accent);color:#fff}
[data-skin^="cristal"] .addbox button,[data-skin^="cristal"] .btn,[data-skin^="cristal"] .mini{background:var(--accent);color:#fff;border-radius:14px}
[data-skin^="cristal"] .btn.quiet{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
[data-skin^="cristal"] .tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
[data-skin^="cristal"] .lr-badge{background:var(--accent);color:#fff}
[data-skin^="cristal"] .lr-emoji{background:var(--surface-2)}
[data-skin^="cristal"] .sheet{background:var(--sheet)}
[data-skin^="cristal"] .finish{background:var(--sheet)}
[data-skin^="cristal"] .field input,[data-skin^="cristal"] .field select,[data-skin^="cristal"] .field textarea{background:var(--sheet);border-color:var(--fline)}
[data-skin^="cristal"] .label .label-note,[data-skin^="cristal"] .r-who.me{color:var(--accent)}
[data-skin^="cristal"] .finish .btn{background:var(--accent);color:#fff}
[data-skin^="cristal"] .skin-opt{background:var(--sheet)}


/* ---------- Cristal minimal ---------- */
:root[data-skin="cristal-perla"]{--bg:#f2f2f3;--m1:#e6e6ea;--m2:#eeeef0;--m3:#e3e3e8;--accent:#151517;--fg:#151517;--muted:#6b6b70;--surface:rgba(255,255,255,.72);--surface-2:rgba(255,255,255,.5);--sheet:#ffffff;--line:rgba(255,255,255,.9);--fline:rgba(20,30,40,.14);--shadow:0 6px 22px -14px rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){:root[data-skin="cristal-perla"]:not([data-theme="light"]){--bg:#0e0e0f;--m1:#1b1b1f;--m2:#161618;--m3:#1d1d22;--accent:#f2f2f3;--fg:#f2f2f3;--muted:#9a9aa0;--sheet:#17171a;--surface:rgba(32,35,38,.62);--surface-2:rgba(44,48,52,.5);--line:rgba(255,255,255,.08);--fline:rgba(255,255,255,.14);--shadow:0 6px 22px -14px rgba(0,0,0,.6)}}
:root[data-skin="cristal-perla"][data-theme="dark"]{--bg:#0e0e0f;--m1:#1b1b1f;--m2:#161618;--m3:#1d1d22;--accent:#f2f2f3;--fg:#f2f2f3;--muted:#9a9aa0;--sheet:#17171a;--surface:rgba(32,35,38,.62);--surface-2:rgba(44,48,52,.5);--line:rgba(255,255,255,.08);--fline:rgba(255,255,255,.14);--shadow:0 6px 22px -14px rgba(0,0,0,.6)}
[data-skin="cristal-perla"] .pill.solid,[data-skin="cristal-perla"] .addbox button,[data-skin="cristal-perla"] .btn,[data-skin="cristal-perla"] .mini,[data-skin="cristal-perla"] .tabs button[aria-selected="true"],[data-skin="cristal-perla"] .lr-badge,[data-skin="cristal-perla"] .finish .btn,[data-skin="cristal-perla"] .row-item.checked .check svg{color:var(--bg)}
[data-skin="cristal-perla"] .btn.quiet{color:var(--fg)}
[data-skin^="cristal-"] .band h1{font-weight:700}
[data-skin^="cristal-"] .rows,[data-skin^="cristal-"] .list-row,[data-skin^="cristal-"] .space-card,[data-skin^="cristal-"] .addbox,[data-skin^="cristal-"] .tabs,[data-skin^="cristal-"] .compare,[data-skin^="cristal-"] .day,[data-skin^="cristal-"] .recipe-card,[data-skin^="cristal-"] .chip{backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2)}

[data-skin="cristal-perla"] .space-card .sc-top{background:var(--surface-2);color:var(--fg);border-bottom:1px solid var(--fline)}
[data-skin="cristal-perla"] .space-card .avatars img{border-color:var(--bg)}
[data-skin="cristal-perla"] .sc-shop{color:var(--fg)}

/* ---- v2: precios, autoría y despensa ---- */
.r-price{display:flex;flex-direction:column;align-items:flex-end;flex:none;font-variant-numeric:tabular-nums;padding-left:4px;max-width:34%;text-align:right}
.r-price strong{font-size:15px;line-height:1.2}
.r-price small{font-size:11px;color:var(--muted);line-height:1.25}
.r-price.book strong{color:inherit}
.r-who2{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:3px}
.stack{display:inline-flex;flex:none}
.stack img{width:22px;height:22px;border-radius:50%;border:2px solid var(--sheet,var(--surface));margin-left:-7px;object-fit:cover}
.stack img:first-child{margin-left:0}
.stack.sm img{width:16px;height:16px;border-width:1.5px;margin-left:-5px}
.stack.sm img:first-child{margin-left:0}
.who-box,.book-note{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px dashed var(--fline,var(--line));border-radius:14px;padding:10px 12px;font-size:13.5px;color:var(--muted);line-height:1.45}
.who-box{align-items:center}
.who-box strong,.book-note strong{color:var(--fg)}
.sum-card{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.sum-card div{display:flex;flex-direction:column;min-width:0}
.sum-card span{font-size:11.5px;color:var(--muted);font-weight:600}
.sum-card strong{font-size:18px;font-variant-numeric:tabular-nums}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1;padding:9px 6px;font-size:13.5px}
.p-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:0;color:inherit;cursor:pointer}
.p-open .r-text{flex:1;min-width:0}
.pr-meta{font-size:12.5px;color:var(--muted)}
.cad{font-weight:700}
.cad.warn{color:#b7791f}
.cad.bad{color:var(--danger)}
.more{border:1px solid var(--fline,var(--line));border-radius:14px}
.more>summary{list-style:none;cursor:pointer;padding:12px 14px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.more>summary::-webkit-details-marker{display:none}
.more>summary::after{content:"▸"}
.more[open]>summary::after{content:"▾"}
.more-in{display:flex;flex-direction:column;gap:12px;padding:0 14px 14px}

.grid2>*,.grid4>*{min-width:0}
.field input,.field select,.field textarea{min-width:0;max-width:100%;box-sizing:border-box}
.field input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-height:46px;text-align:left}
.field input[type=date]::-webkit-date-and-time-value{text-align:left}
.date-field{overflow:hidden}
.pm-book{font-style:italic}
.pm-last{font-weight:600;color:var(--fg)}
.book-src{font-size:12.5px;color:var(--muted);margin:-2px 0 0}

.pcat-bar{display:flex;flex-direction:column;gap:10px}
.pcat-bar .chips{flex-wrap:nowrap}
.chip.add{border-style:dashed;color:var(--muted)}
.pgroup{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.pcat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.pcat-head .label{margin:0}
.pcat-head .r-edit{width:34px;height:34px}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px}

/* ---- Deslizar para eliminar ---- */
.row-item.swipe{display:block;position:relative;overflow:hidden;padding:0;min-height:0;-webkit-user-select:none;user-select:none}
.sw-content{display:flex;align-items:center;gap:4px;padding-right:6px;min-height:58px;position:relative;z-index:1;
  background:var(--sheet,var(--surface));transform:translateX(0);transition:transform .28s cubic-bezier(.2,.8,.2,1);touch-action:pan-y;will-change:transform}
body.store .row-item.swipe .sw-content{min-height:70px}
.sw-actions{position:absolute;inset:0;display:flex;justify-content:flex-end;background:var(--danger)}
.row-item.swipe .sw-actions{opacity:0;transition:opacity 0s .3s}
.row-item.swipe.open .sw-actions,.row-item.swipe.dragging .sw-actions,.row-item.swipe.removing .sw-actions{opacity:1;transition:none}
.sw-del{border:0;background:var(--danger);color:#fff;font-weight:700;font-size:15px;width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:width .28s cubic-bezier(.2,.8,.2,1)}
.sw-del svg{width:20px;height:20px}
.row-item.dragging .sw-content,.row-item.dragging .sw-del{transition:none}
.row-item.removing{transition:height .24s ease,opacity .24s ease}
.toast-act{display:flex;align-items:center;gap:14px;pointer-events:auto}
.toast-act button{border:0;background:none;color:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:2px 0;cursor:pointer}

.li-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 6px}
.li-head .catlabel{margin:0}
.li-head .r-edit{width:32px;height:32px}
.list-cats{display:flex;flex-direction:column;gap:8px}
.list-cats .chips{flex-wrap:nowrap}
.list-cats .chip.on,.pcat-bar .chip.on{background:var(--fg)!important;color:var(--bg)!important;border-color:var(--fg)!important}
.list-cats .chip.on em,.pcat-bar .chip.on em{color:inherit;opacity:.7}

.cfg-list{list-style:none;margin:0;padding:0;border:1px solid var(--fline,var(--line));border-radius:16px;overflow:hidden}
.cfg-row{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-top:1px solid var(--fline,var(--line));background:var(--sheet,var(--surface))}
.cfg-row:first-child{border-top:0}
.cfg-row.off .cfg-name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--fline,var(--line))}
.cfg-name{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.cfg-name em{font-style:normal;font-weight:500;color:var(--muted);font-size:12.5px;margin-left:4px}
.cfg-tog{flex:none;width:44px;height:26px;border-radius:999px;border:0;background:var(--surface-2);position:relative;padding:0}
.cfg-tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.cfg-tog[aria-checked="true"]{background:var(--fg)}
.cfg-tog[aria-checked="true"]::after{transform:translateX(18px);background:var(--bg)}
.cfg-mv{flex:none;width:32px;height:32px;border:0;border-radius:9px;background:none;color:var(--muted);font-size:16px}
.cfg-mv:hover{background:var(--surface-2);color:var(--fg)}
.cfg-mv[disabled]{opacity:.25}
.cfg-actions{display:flex;flex-wrap:wrap;gap:8px}

/* ---- Arrastrar a otra categoría ---- */
.row-item.swipe,.pantry-row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.drag-ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;display:flex;align-items:center;gap:8px;padding:9px 16px 9px 12px;border-radius:999px;
  background:var(--fg);color:var(--bg);font-weight:700;font-size:15px;box-shadow:0 14px 34px rgba(0,0,0,.35);will-change:transform}
.drag-ghost .r-ico{font-size:20px;width:auto}
.drag-ghost .r-photo{width:24px;height:24px}
.drag-src{opacity:.35;transition:opacity .15s}
body.cat-dragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
body.cat-dragging .cat-group{border-radius:16px;outline:2px dashed transparent;outline-offset:4px;transition:outline-color .15s,background .15s}
body.cat-dragging .cat-group.drop-on{outline-color:var(--fg);background:color-mix(in srgb,var(--fg) 7%,transparent)}
.chip.drop-on{background:var(--fg)!important;color:var(--bg)!important;border-color:var(--fg)!important;transform:scale(1.06)}
.drag-hint{margin:0;font-size:12.5px;color:var(--muted)}

.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sheet>*{flex-shrink:0}

.suggest .sg-head{padding:8px 14px 4px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
.suggest .sg-head:first-child{border-top:0}
.sg-tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);margin-right:4px;vertical-align:1px}
.sg-tag.no{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.sg-tag.poco{background:color-mix(in srgb,#d98a00 16%,transparent);color:#a86a00}
.row-add.pantry-hit .r-plus{font-weight:700}

/* ---- Cantidad rápida ---- */
.r-qty{display:inline-flex;align-items:center;justify-content:center;line-height:1;flex:none;min-width:46px;max-width:92px;height:34px;padding:0 11px;margin-left:4px;border-radius:999px;border:1px solid var(--fline,var(--line));background:var(--surface-2);color:var(--fg);
  font:inherit;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.r-qty,[data-skin] .r-qty{background:color-mix(in srgb,var(--fg) 8%,transparent);border-color:color-mix(in srgb,var(--fg) 14%,transparent)}
.r-qty.empty{color:var(--muted);font-weight:600}
.qty-sheet .chip{border:1px solid color-mix(in srgb,var(--fg) 14%,transparent)}
.row-item.checked .r-qty{opacity:.55}
.qty-sheet .qty-head{display:flex;align-items:center;gap:12px}
.qty-sheet .qty-head .r-ico{font-size:30px}
.qty-step{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 0}
.qty-step .qs-btn{width:60px;height:60px;border-radius:50%;border:1px solid var(--fline,var(--line));background:var(--surface-2);color:var(--fg);font-size:30px;font-weight:500;line-height:1;display:grid;place-items:center}
.qty-step .qs-btn:active{transform:scale(.94)}
.qty-step input{width:120px;text-align:center;font:inherit;font-size:40px;font-weight:800;border:0;background:none;color:var(--fg);padding:0;-moz-appearance:textfield}
.qty-step input::-webkit-inner-spin-button,.qty-step input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.qty-sheet .chips{flex-wrap:wrap}
.qty-sheet .chip.on{background:var(--fg)!important;color:var(--bg)!important;border-color:var(--fg)!important}
.qty-sheet .qty-price{margin:0;text-align:center;font-size:15px;color:var(--muted);min-height:20px}
.qty-sheet .qty-price strong{color:var(--fg)}
.qty-sheet .qty-foot{display:flex;gap:10px}
.qty-sheet .qty-foot .btn{flex:1}

/* ---- Comparador: qué productos cuenta cada súper ---- */
.cmp-rows li.cmp-li{display:block;padding:0}
.cmp-st-d summary{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;list-style:none}
.cmp-st-d summary::-webkit-details-marker{display:none}
.cmp-st-d .cmp-cov{text-decoration:underline dotted;text-underline-offset:3px}
.cmp-st-d .cmp-mini-chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 2px 3px;transition:transform .15s;flex:none}
.cmp-st-d[open] .cmp-mini-chev{transform:rotate(-135deg);margin-bottom:-3px}
.cmp-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 12px}
.cmp-chip{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--fg) 6%,transparent);border:1px solid color-mix(in srgb,var(--fg) 10%,transparent)}
.cmp-chip b{font-weight:700;font-variant-numeric:tabular-nums}
.cmp-chip.both{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.cmp-chip.miss{color:var(--muted);background:none;border-style:dashed}
.cmp-fair{margin:4px 14px 10px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.cmp-fair .label{margin:0 0 8px}
.cmp-fair .cmp-chips{padding:0 0 10px}
.cmp-fair-tot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-size:14.5px}
.cmp-fair-tot span{font-variant-numeric:tabular-nums}
.cmp-fair-tot .win{font-weight:800}
.cmp-fair p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.cmp-fair p strong{color:var(--fg)}
.cmp-legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);padding:2px 14px 8px}

/* ---- Vista «¿Hay en casa?» ---- */
.pview{display:flex;gap:4px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--fg) 7%,transparent)}
.pview button{flex:1;min-height:42px;border:0;border-radius:11px;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.pview button[aria-pressed="true"]{background:var(--sheet,var(--surface));color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pview em{font-style:normal;font-size:12px;font-weight:700;opacity:.7}
.p-watch{flex:none;width:38px;height:38px;border:0;border-radius:10px;background:none;color:var(--muted);display:grid;place-items:center;padding:0}
.p-watch svg{width:21px;height:21px}
.p-watch[aria-pressed="true"]{color:var(--fg)}
.p-watch svg .rb-fill{fill:none}
.p-watch[aria-pressed="true"] svg .rb-fill{fill:currentColor}
.p-watch[aria-pressed="true"] svg .rb-arr{stroke:var(--sheet,var(--surface))}
.w-last{font-size:12.5px;color:var(--muted)}
.watch-intro{margin:0;font-size:13.5px;color:var(--muted)}
.chk-row{display:flex;align-items:center;gap:10px;font-size:14.5px;grid-column:1/-1;padding:4px 0}
.chk-row input{width:22px;height:22px;accent-color:var(--fg)}

/* ---- Menú con fechas y calendario ---- */
.menu-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.menu-month{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.menu-month small{display:block;font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.day-name .dnum{font-variant-numeric:tabular-nums}
.day-name .dmon{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);background:none;text-transform:none;letter-spacing:0;padding:0}
.day-name .dtag{margin-left:auto}
.day.tomorrow .day-name .dtag{background:color-mix(in srgb,var(--fg) 10%,transparent);color:var(--fg)}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav h3{flex:1;margin:0;text-align:center;font-family:var(--f-display);font-size:19px;font-weight:800;text-transform:capitalize}
.cal-nav button{width:40px;height:40px;border-radius:12px;border:1px solid color-mix(in srgb,var(--fg) 12%,transparent);background:none;color:var(--fg);font-size:18px}
.cal-years{flex-wrap:wrap}
.cal-years .chip{border:1px solid color-mix(in srgb,var(--fg) 14%,transparent)}
.cal-years .chip.on{background:var(--fg)!important;color:var(--bg)!important;border-color:var(--fg)!important}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cal-day{aspect-ratio:1/1.08;border-radius:10px;border:1px solid transparent;background:color-mix(in srgb,var(--fg) 4%,transparent);color:var(--fg);font:inherit;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.cal-day .cd-n{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.cal-day .cd-e{font-size:14px;line-height:1.05;white-space:nowrap;overflow:hidden;max-width:100%}
.cal-day.has{background:color-mix(in srgb,var(--fg) 9%,transparent)}
.cal-day.plan{border-style:dashed;border-color:color-mix(in srgb,var(--fg) 28%,transparent)}
.cal-day.today{border-color:var(--fg);border-style:solid}
.cal-day.sel{background:var(--fg);color:var(--bg)}
.cal-day.empty{background:none}
.cal-day:disabled{opacity:.45}
.cal-pad{visibility:hidden}
.cal-sum{margin:0;font-size:13.5px;color:var(--muted);text-align:center}
.cal-det{border:1px solid var(--fline,var(--line));border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cal-det h3{margin:0;font-size:16px}
.cal-meal{display:flex;align-items:center;gap:10px}
.cal-meal .cm-k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:52px;flex:none}
.cal-meal .cm-v{flex:1;min-width:0;font-weight:600}
.cal-meal .btn{flex:none;min-height:36px;padding:0 12px;font-size:13.5px}
.rep-days{flex-wrap:wrap}
.rep-days .chip{border:1px solid color-mix(in srgb,var(--fg) 14%,transparent);flex-direction:column;align-items:flex-start;gap:0;line-height:1.2;padding:7px 12px}
.rep-days .chip small{font-size:11.5px;color:var(--muted);font-weight:500}
.rep-days .chip.on{background:var(--fg)!important;color:var(--bg)!important;border-color:var(--fg)!important}
.rep-days .chip.on small{color:inherit;opacity:.75}
.recent-meals{flex-wrap:wrap}
.recent-meals .chip{border:1px solid color-mix(in srgb,var(--fg) 14%,transparent)}

/* ---- Menú: nuevo diseño ---- */
.menu-hero{display:flex;align-items:flex-start;gap:14px;padding:16px;border-radius:var(--r);background:var(--sheet,var(--surface));border:1px solid var(--fline,var(--line));box-shadow:var(--shadow)}
.menu-hero .mh-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mh-kicker{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.menu-hero .menu-month{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.02em}
.mh-sub{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.mh-bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--fg) 9%,transparent);overflow:hidden;margin-top:10px}
.mh-bar i{display:block;height:100%;border-radius:inherit;background:var(--fg);transition:width .4s ease}
.mh-cal{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:74px;height:74px;border-radius:18px;border:1px solid color-mix(in srgb,var(--fg) 12%,transparent);background:color-mix(in srgb,var(--fg) 5%,transparent);color:var(--fg);font:inherit;font-size:11.5px;font-weight:700}
.mh-cal .mh-ico{font-size:26px;line-height:1}
.mh-cal em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:600}
.menu-acts{display:flex;gap:8px;flex-wrap:wrap}
.menu-acts .btn{min-height:42px;border-radius:999px;font-size:14px;padding:0 16px}
.menu-acts .btn:disabled{opacity:.45}
.week.mweek{display:flex;flex-direction:column;gap:10px}
.week.mweek .day,[data-skin] .week.mweek .day{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:10px;align-items:stretch}
.mday-date{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:14px;background:color-mix(in srgb,var(--fg) 6%,transparent);padding:8px 0}
.md-wd{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.md-n{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.md-m{font-size:11px;font-weight:600;color:var(--muted)}
.md-tag{margin-top:4px;font-size:9px;font-weight:800;letter-spacing:.04em;max-width:58px;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--fg) 12%,transparent)}
.week.mweek .day.today .mday-date{background:var(--fg);color:var(--bg)}
.week.mweek .day.today .md-wd,.week.mweek .day.today .md-m{color:inherit;opacity:.75}
.week.mweek .day.today .md-tag{background:var(--bg);color:var(--fg)}
.week.mweek .day.today,[data-skin] .week.mweek .day.today{border-color:color-mix(in srgb,var(--fg) 40%,transparent);box-shadow:0 10px 26px -16px rgba(0,0,0,.55)}
.mday-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.mday-body .day-name{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mslot,[data-skin] .mslot{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 10px;border-radius:13px;border:1.5px dashed color-mix(in srgb,var(--fg) 16%,transparent);background:none;color:var(--fg);font:inherit;text-align:left;width:100%}
.mslot.filled{border-style:solid;border-color:color-mix(in srgb,var(--fg) 10%,transparent);background:color-mix(in srgb,var(--fg) 6%,transparent)}
.mslot:active{transform:scale(.985)}
.ms-meal{flex:none;width:56px;display:flex;flex-direction:column;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.25}
.ms-meal b{font-size:15px;font-weight:400;letter-spacing:0}
.ms-val{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;line-height:1.25}
.ms-val .ms-emo{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:var(--sheet,var(--surface));box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ms-val .ms-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ms-empty{flex:1;color:var(--muted);font-size:14px;font-weight:600}
.menu-tip{margin:0;font-size:12.5px;color:var(--muted);text-align:center}

/* ---- Botón «Volver a comprar»: media vuelta suave y las flechas se iluminan ---- */
@keyframes rbSpin{from{transform:rotate(0)}to{transform:rotate(180deg)}}
.p-watch,.p-watch[aria-pressed="true"]{background:none!important;box-shadow:none!important}
.p-watch{color:var(--muted)}
.p-watch svg{transition:filter .45s ease,color .45s ease}
.p-watch svg .rb-fill{display:none}
.p-watch svg .rb-arr,.p-watch[aria-pressed="true"] svg .rb-arr{stroke:currentColor}
.p-watch[aria-pressed="true"]{color:var(--fg)}
.p-watch[aria-pressed="true"] svg{filter:drop-shadow(0 0 2px color-mix(in srgb,var(--fg) 85%,transparent)) drop-shadow(0 0 7px color-mix(in srgb,var(--fg) 55%,transparent))}
.p-watch.spin svg{animation:rbSpin .75s cubic-bezier(.45,0,.25,1)}
@media (prefers-reduced-motion:reduce){.p-watch.spin svg{animation:none}}

/* ---- Buscador de la despensa ---- */
.psearch{display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;min-height:46px;border-radius:14px;background:var(--sheet,var(--surface));border:1px solid var(--fline,var(--line))}
.psearch svg{width:18px;height:18px;flex:none;color:var(--muted)}
.psearch input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:16px;padding:10px 0;outline:none}
.psearch input::-webkit-search-cancel-button{display:none}
.psearch button{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--fg);font-size:16px;line-height:1}
.psearch:focus-within{border-color:color-mix(in srgb,var(--fg) 35%,transparent)}
.ps-head{margin:0;font-size:13.5px;color:var(--muted)}
.ps-tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--fg) 9%,transparent);color:var(--muted);margin-left:6px;vertical-align:1px}
/* ---- Filas de «Volver a comprar» ---- */
.wrow{flex-wrap:nowrap}
.wrow .p-open{flex:1;min-width:0}
.wrow .mini.inl{background:none!important;color:var(--muted)!important;border:1px solid color-mix(in srgb,var(--fg) 14%,transparent)}

/* ---- Web independiente ---- */

/* ============ State ============ */

  const el=document.createElement("div"); el.className="toast toast-act";
  const t=document.createElement("span"); t.textContent=msg; const b=document.createElement("button"); b.textContent=label;
  b.onclick=()=>{ el.remove(); fn(); }; el.append(t,b);
  if(document.getElementById("finishBar")) el.style.bottom="calc(84px + env(safe-area-inset-bottom,0px))";
  $("#toastRoot").replaceChildren(el); setTimeout(()=>el.remove(),ms||5000);
}
function toast(msg){
  const el=document.createElement("div");el.className="toast";el.textContent=msg;
  if(document.getElementById("finishBar")) el.style.bottom="calc(84px + env(safe-area-inset-bottom,0px))";

  else if(e&&e.code==="invalid_argument"&&!S.canWrite) toast("Solo tienes permiso de lectura.");

/* ============ Derived data ============ */
const mySpaceIds = () => new Set(S.memberships.filter(m=>m.uid===S.me).map(m=>m.spaceId));
const membersOf = sid => S.memberships.filter(m=>m.spaceId===sid).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
const listsOf = sid => [...S.lists.values()].filter(l=>l.spaceId===sid).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const itemsOf = lid => [...S.items.values()].filter(i=>i.listId===lid);
async function getProfiles(ids){
  if(HAS_FIREBASE) return S.profiles;

  try{ const p=await S.user.profiles([...new Set(ids)]); Object.assign(S.profiles,p); return p;}catch(e){return {}}

const pname = (id) => (S.profiles[id]&&S.profiles[id].name) || (id===S.me?"Tú":"Alguien");

/* ============ Modo prueba (fuera de claude.ai) ============
   Base de datos local mínima que imita la de claude.ai y guarda en este navegador. */
function makeLocalDB(){
  const KEY=window.__DEMO_KEY||"la-cesta-demo"; let data={};
  try{data=JSON.parse(localStorage.getItem(KEY)||"{}");}catch(e){}
  if(!Object.keys(data).length&&window.__DEMO_SEED){ data=JSON.parse(JSON.stringify(window.__DEMO_SEED)); try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){} }
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}};
  const listeners=new Set();
  const notify=()=>setTimeout(()=>listeners.forEach(l=>l()),0);
  const rid=()=>Math.random().toString(36).slice(2,12)+Date.now().toString(36).slice(-4);
  const snapDoc=(id,body)=>({id,exists:!!body,data:()=>body?{...body}:undefined,metadata:{fromCache:false,hasPendingWrites:false}});
  function query(coll,filters){
    const run=()=>{const docs=Object.entries(data).filter(([p,b])=>{const i=p.lastIndexOf("/");return p.slice(0,i)===coll&&filters.every(([f,op,v])=>op==="=="?b[f]===v:true);}).map(([p,b])=>snapDoc(p.slice(p.lastIndexOf("/")+1),b));return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}};};
    return {
      where:(f,op,v)=>query(coll,[...filters,[f,op,v]]),
      get:async()=>run(),
      onSnapshot:(next)=>{const l=()=>next(run());listeners.add(l);setTimeout(l,0);return ()=>listeners.delete(l);}
    };
  }
  function doc(path){return {
    id:path.slice(path.lastIndexOf("/")+1),path,
    get:async()=>snapDoc(path.slice(path.lastIndexOf("/")+1),data[path]),
    set:async b=>{data[path]=JSON.parse(JSON.stringify(b));save();notify();},
    update:async b=>{if(!data[path])throw{code:"invalid_argument"};data[path]={...data[path],...b};save();notify();},
    delete:async()=>{delete data[path];save();notify();},
    onSnapshot:(next)=>{const l=()=>next(snapDoc(path.slice(path.lastIndexOf("/")+1),data[path]));listeners.add(l);setTimeout(l,0);return ()=>listeners.delete(l);}
  };}
  function collection(path){const q=query(path,[]);return {...q,path,doc:id=>doc(path+"/"+(id||rid())),add:async b=>{const d=doc(path+"/"+rid());await d.set(b);return d;}};}
  window.addEventListener("storage",e=>{if(e.key===KEY){try{data=JSON.parse(e.newValue||"{}");}catch(x){}notify();}});
  return {doc,collection};
}
const DEMO_NAMES={yo:"Tú",mama:"Mamá",papa:"Papá"};
const localUser={id:async()=>window.__demoUser||"yo",can:async()=>true,profiles:async ids=>Object.fromEntries([].concat(ids).map(id=>[id,{id,name:DEMO_NAMES[id]||"Familiar",avatarUrl:avatarSVG((DEMO_NAMES[id]||"F").charAt(0),id),isMe:id===(window.__demoUser||"yo")}]))};
function avatarSVG(t,id){let h=40;for(const ch of String(id||t))h=(h*31+ch.charCodeAt(0))%360;return "data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="hsl(${h},55%,74%)"/><text x="16" y="21" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1c2420">${t}</text></svg>`);}

/* ============ Firebase ============
   Estructura en Firestore (todo lo de un espacio cuelga de él):
   users/{uid}                     perfil (nombre, foto)
   users/{uid}/spaces/{sid}        índice de mis espacios
   invites/{code}                  código de invitación -> spaceId
   spaces/{sid}                    datos del espacio
   spaces/{sid}/members/{uid}      miembros
   spaces/{sid}/{lists|items|purchases|recipes|pantry|prices}/{id}
   spaces/{sid}/meta/menu          menú semanal
*/
const HAS_FIREBASE = typeof firebase!=="undefined" && typeof FIREBASE_CONFIG==="object" && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !/PEGA_AQUI/i.test(FIREBASE_CONFIG.apiKey);
const SCOPED = new Set(["lists","items","purchases","recipes","pantry","prices"]);

/* Escrituras «suaves»: sin conexión, Firestore las guarda en el móvil y las sube al volver la cobertura.
   No esperamos al servidor para que la app siga respondiendo en el súper. */
function soft(p){
  p.catch(e=>console.warn("Escritura pendiente o rechazada:",e));
  if(navigator.onLine!==false) return p;
  return Promise.race([p,new Promise(r=>setTimeout(r,600))]);
}
function makeFirebaseDB(fs){
  const sidFor=(coll,id,data)=>{
    if(data&&data.spaceId) return data.spaceId;
    if(coll==="prices"&&id.includes("__")) return id.split("__")[0];
    const m=S[coll]; const o=m&&m.get&&m.get(id); if(o&&o.spaceId) return o.spaceId;
    return S.itemsSpace||S.view.spaceId;
  };
  const phys=(path,data)=>{
    const i=path.indexOf("/"); const coll=path.slice(0,i), id=path.slice(i+1);
    if(coll==="memberships"){ const [sid,uid]=id.split("__"); return `spaces/${sid}/members/${uid}`; }
    if(coll==="menus") return `spaces/${id}/meta/menu`;
    if(SCOPED.has(coll)) return `spaces/${sidFor(coll,id,data)}/${coll}/${id}`;
    return path;
  };
  const newId=()=>fs.collection("_").doc().id;
  const wrapDoc=path=>({
    id:path.slice(path.lastIndexOf("/")+1), path,
    get:()=>fs.doc(phys(path)).get(),
    set:d=>soft(fs.doc(phys(path,d)).set(d)),
    update:d=>soft(fs.doc(phys(path,d)).update(d)),
    delete:()=>soft(fs.doc(phys(path)).delete()),
    onSnapshot:(n,e)=>fs.doc(phys(path)).onSnapshot(n,e)
  });
  const wrapColl=(coll,sid)=>{
    const p=sid&&SCOPED.has(coll)?`spaces/${sid}/${coll}`:coll;
    return {
      path:p,
      where:(f,op,v)=>(f==="spaceId"&&op==="==")?wrapColl(coll,v):wrapColl(coll,sid),
      onSnapshot:(n,e)=>fs.collection(p).onSnapshot(n,e),
      get:()=>fs.collection(p).get(),
      doc:id=>wrapDoc(coll+"/"+(id||newId())),
      add:async d=>{ const r=wrapDoc(coll+"/"+newId()); await r.set(d); return r; }
    };
  };
  return { doc:wrapDoc, collection:c=>wrapColl(c,null) };
}

/* ---- Perfiles: nombre y foto guardados en cada miembro ---- */
function hueOf(s){let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))%360;return h;}
function avatarFor(uid,name){
  const t=(name||"?").trim().charAt(0).toUpperCase()||"?";
  return "data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="hsl(${hueOf(uid)},45%,78%)"/><text x="16" y="21" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1c1c1e">${t.replace(/[<&>]/g,"")}</text></svg>`);
}
function setProfile(uid,name,photo){ S.profiles[uid]={id:uid,name:name||"",avatarUrl:photo||avatarFor(uid,name)}; }
function rebuildMembers(){
  S.memberships=[].concat(...S.memberMap.values());
  S.memberships.forEach(m=>setProfile(m.uid,m.name,m.photo));
  if(S.me) setProfile(S.me,S.meName,S.mePhoto);
}

/* ---- Suscripciones a cada uno de mis espacios ---- */
function watchSpace(sid){
  if(S.spaceWatch.has(sid)) return;
  const fs=S.fs, un=[];
  const denied=e=>{ console.warn(e); if(e&&e.code==="permission-denied") dropSpace(sid,true); };
  un.push(fs.doc("spaces/"+sid).onSnapshot(s=>{ if(s.exists){ S.spaces.set(sid,{id:sid,...s.data()}); refresh(); } else dropSpace(sid,true); },denied));
  un.push(fs.collection(`spaces/${sid}/members`).onSnapshot(s=>{ S.memberMap.set(sid,s.docs.map(d=>({...d.data(),id:sid+"__"+d.id,spaceId:sid,uid:d.id}))); rebuildMembers(); refresh(); },denied));
  un.push(fs.collection(`spaces/${sid}/lists`).onSnapshot(s=>{
    for(const [k,v] of S.lists) if(v.spaceId===sid) S.lists.delete(k);
    s.docs.forEach(d=>S.lists.set(d.id,{...d.data(),id:d.id,spaceId:sid})); refresh(); },denied));
  S.spaceWatch.set(sid,un);
}
function dropSpace(sid,cleanIndex){
  (S.spaceWatch.get(sid)||[]).forEach(u=>{try{u()}catch(e){}});
  S.spaceWatch.delete(sid); S.spaces.delete(sid); S.memberMap.delete(sid);
  for(const [k,v] of S.lists) if(v.spaceId===sid) S.lists.delete(k);
  rebuildMembers();
  if(cleanIndex&&S.me) S.fs.doc(`users/${S.me}/spaces/${sid}`).delete().catch(()=>{});
  refresh();
}

async function bootFirebase(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs=firebase.firestore();
  try{ fs.settings({ignoreUndefinedProperties:true}); }catch(e){}
  try{ await fs.enablePersistence({synchronizeTabs:true}); }catch(e){ console.info("Sin modo sin conexión en este navegador:",e&&e.code); }
  S.fs=fs; S.db=makeFirebaseDB(fs);
  S.spaceWatch=new Map(); S.memberMap=new Map();
  try{ await firebase.auth().getRedirectResult(); }catch(e){ S.loginError=authMsg(e); }
  firebase.auth().onAuthStateChanged(u=>{ if(u) onSignedIn(u); else { S.me=null; S.needLogin=true; S.authReady=true; render(); } });
}
function onSignedIn(u){
  S.needLogin=false; S.authReady=true; S.loginError="";
  S.me=u.uid; S.meName=u.displayName||(u.email||"").split("@")[0]||"Yo"; S.mePhoto=u.photoURL||"";
  setProfile(S.me,S.meName,S.mePhoto);
  S.fs.doc("users/"+S.me).set({name:S.meName,photo:S.mePhoto,lastSeen:Date.now()},{merge:true}).catch(()=>{});
  let first=true;
  S.indexUnsub=S.fs.collection(`users/${S.me}/spaces`).onSnapshot(snap=>{
    const ids=new Set(snap.docs.map(d=>d.id));
    ids.forEach(watchSpace);
    [...S.spaceWatch.keys()].filter(k=>!ids.has(k)).forEach(k=>dropSpace(k,false));
    S.ready=true; refresh();
    if(first){ first=false; syncMyProfile(ids); const pj=takePendingJoin(); if(pj) openJoin(pj); }
  },e=>{ console.warn(e); S.ready=true; refresh(); });
  render();
}
/* Mantiene mi nombre y foto al día en los espacios donde estoy */
function syncMyProfile(ids){
  ids.forEach(sid=>S.fs.doc(`spaces/${sid}/members/${S.me}`).update({name:S.meName,photo:S.mePhoto}).catch(()=>{}));
}
function takePendingJoin(){
  let c=S.pendingJoin; S.pendingJoin=null;
  try{ if(!c) c=sessionStorage.getItem("pendingJoin"); sessionStorage.removeItem("pendingJoin"); }catch(e){}
  return c||null;
}

/* ---- Crear, unirse, salir y borrar espacios ---- */
async function fbCreateSpace({name,emoji,color}){
  const fs=S.fs; let code=makeCode();
  for(let k=0;k<5;k++){ const g=await fs.doc("invites/"+code).get(); if(!g.exists) break; code=makeCode(); }
  const ref=fs.collection("spaces").doc(); const sid=ref.id, now=Date.now();
  await ref.set({name,emoji,color,code,createdBy:S.me,createdAt:now});
  await fs.doc(`spaces/${sid}/members/${S.me}`).set({code,role:"creator",joinedAt:now,name:S.meName,photo:S.mePhoto});
  await fs.doc("invites/"+code).set({spaceId:sid});
  await fs.doc(`spaces/${sid}/lists/${fs.collection("_").doc().id}`).set({spaceId:sid,name:"Supermercado",emoji:"🛒",createdAt:now,createdBy:S.me});
  await fs.doc(`users/${S.me}/spaces/${sid}`).set({joinedAt:now});
  return sid;
}
async function fbJoinByCode(code){
  const fs=S.fs; const g=await fs.doc("invites/"+code).get();
  if(!g.exists) return {ok:false,msg:"No hay ningún espacio con ese código. Revisa que esté bien escrito."};
  const sid=g.data().spaceId;
  if(mySpaceIds().has(sid)) return {ok:true,sid,already:true};
  try{ await fs.doc(`spaces/${sid}/members/${S.me}`).set({code,role:"member",joinedAt:Date.now(),name:S.meName,photo:S.mePhoto}); }
  catch(e){ console.warn(e); return {ok:false,msg:"No se ha podido entrar en el espacio. Pide un enlace nuevo a quien te invitó."}; }
  await fs.doc(`users/${S.me}/spaces/${sid}`).set({joinedAt:Date.now()});
  return {ok:true,sid};
}
async function fbLeaveSpace(sid){
  const sp=S.spaces.get(sid);
  if(sp&&sp.shopping&&sp.shopping.uid===S.me){ try{ await S.fs.doc("spaces/"+sid).update({shopping:null}); }catch(e){} }
  await S.fs.doc(`spaces/${sid}/members/${S.me}`).delete();
  await S.fs.doc(`users/${S.me}/spaces/${sid}`).delete();
}
async function fbDeleteSpace(sid){
  const fs=S.fs; const sp=S.spaces.get(sid)||(await fs.doc("spaces/"+sid).get()).data()||{};
  for(const coll of ["items","purchases","recipes","pantry","prices","lists","meta"]){
    try{ const q=await fs.collection(`spaces/${sid}/${coll}`).get(); for(const d of q.docs) await d.ref.delete(); }catch(e){ console.warn(coll,e); }
  }
  if(sp.code){ try{ await fs.doc("invites/"+sp.code).delete(); }catch(e){} }
  const mem=await fs.collection(`spaces/${sid}/members`).get();
  for(const d of mem.docs) if(d.id!==S.me) await d.ref.delete();
  await fs.doc("spaces/"+sid).delete();
  await fs.doc(`spaces/${sid}/members/${S.me}`).delete();
  await fs.doc(`users/${S.me}/spaces/${sid}`).delete();
}

/* ---- Pantalla de entrada ---- */
function authMsg(e){
  const c=e&&e.code||"";
  if(c.includes("popup-closed")||c.includes("cancelled-popup")) return "";
  if(c.includes("unauthorized-domain")) return "Esta web no está autorizada en Firebase. Añade este dominio en Authentication › Configuración › Dominios autorizados.";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")) return "Correo o contraseña incorrectos.";
  if(c.includes("email-already-in-use")) return "Ya hay una cuenta con ese correo. Pulsa «Entrar».";
  if(c.includes("weak-password")) return "La contraseña debe tener al menos 6 caracteres.";
  if(c.includes("invalid-email")) return "Ese correo no es válido.";
  if(c.includes("operation-not-allowed")) return "Este método de entrada no está activado en Firebase (Authentication › Método de inicio de sesión).";
  if(c.includes("network")) return "No hay conexión. Comprueba internet e inténtalo otra vez.";
  if(c.includes("too-many-requests")) return "Demasiados intentos. Espera un momento.";
  return "No se ha podido entrar ("+(c||"error")+").";
}

/* ============ Boot ============ */
async function boot(){
  const m=location.hash.match(/^#join-([A-Za-z0-9]{6})$/);
  if(m){ S.pendingJoin=m[1].toUpperCase(); try{sessionStorage.setItem("pendingJoin",S.pendingJoin);}catch(e){}
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
  if(HAS_FIREBASE){ S.authReady=false; S.needLogin=true; render(); try{ await bootFirebase(); }catch(e){ console.error(e); S.needLogin=false; S.failed=true; render(); } return; }
  render();
  try{
    const db=makeLocalDB(), user=localUser; S.demo=true;
    S.user=user; S.db=db; S.me=await user.id();
    db.collection("spaces").onSnapshot(snap=>{S.spaces=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));S.ready=true;refresh();},e=>console.warn(e));
    db.collection("memberships").onSnapshot(snap=>{S.memberships=snap.docs.map(d=>({id:d.id,...d.data()}));refresh();},e=>console.warn(e));
    db.collection("lists").onSnapshot(snap=>{S.lists=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));refresh();},e=>console.warn(e));
    if(S.pendingJoin){ openJoin(S.pendingJoin); }
  }catch(e){console.warn(e);S.failed=true;render();}
}
function subscribeItems(sid){
  if(S.itemsSpace===sid) return;
  if(S.itemsUnsub){S.itemsUnsub();S.itemsUnsub=null;}
  if(S.purchUnsub){S.purchUnsub();S.purchUnsub=null;}
  S.extraUnsubs.forEach(u=>{try{u()}catch(e){}}); S.extraUnsubs=[];
  S.itemsSpace=sid;S.items=new Map();S.purchases=new Map();S.recipes=new Map();S.pantry=new Map();S.prices=new Map();S.menu=null;
  if(!sid||!S.db) return;
  S.itemsUnsub=S.db.collection("items").where("spaceId","==",sid).onSnapshot(snap=>{
    S.items=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));refresh();
  },e=>console.warn(e));
  S.purchUnsub=S.db.collection("purchases").where("spaceId","==",sid).onSnapshot(snap=>{
    S.purchases=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));refresh();
  },e=>console.warn(e));
  const mapSub=(coll,key)=>S.db.collection(coll).where("spaceId","==",sid).onSnapshot(snap=>{S[key]=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));refresh();},e=>console.warn(e));
  S.extraUnsubs.push(mapSub("recipes","recipes"),mapSub("pantry","pantry"),mapSub("prices","prices"));
  S.extraUnsubs.push(S.db.doc("menus/"+sid).onSnapshot(snap=>{S.menu=snap.exists?snap.data():null;refresh();},e=>console.warn(e)));
}

function go(view){
  if(!(view.name==="list"&&S.view.name==="list"&&view.listId===S.view.listId)){ S.listFilter=""; S.listFilterNew=false; }
  if(view.name!=="list"&&S.storeMode){ S.storeMode=false; S.mineOnly=false; try{wakeLock&&wakeLock.release();}catch(e){} wakeLock=null; }
  document.body.classList.remove("store");
  S.view=view; S.query="";
  if(view.name==="space"||view.name==="list") subscribeItems(view.spaceId); else subscribeItems(null);
  render(); window.scrollTo(0,0);
}

/* render = mount the view skeleton; refresh = repaint data regions */
function render(){
  const v=S.view;
  if(v.name==="list") mountList(); else { $("#main").innerHTML='<div id="dyn"></div>'; }
  refresh();
}
let refreshToken=0;
async function refresh(){
  const t=++refreshToken; const v=S.view;
  if(HAS_FIREBASE&&!S.me&&!S.failed){ if(v.name!=="home"){ S.view={name:"home"}; return render(); } return paintLogin(); }
  // validate view still exists
  if(S.ready && v.name!=="home"){
    const sp=S.spaces.get(v.spaceId);
    const member=sp&&mySpaceIds().has(v.spaceId);
    if(member&&S.grace===v.spaceId) S.grace=null;
    if(!member){ if(S.grace===v.spaceId) return; S.view={name:"home"}; subscribeItems(null); return render(); }
    if(v.name==="list"){ const l=S.lists.get(v.listId);
      if(l&&S.graceList===v.listId) S.graceList=null;
      if(!l){ if(S.graceList===v.listId) return; S.view={name:"space",spaceId:v.spaceId}; return render(); } }
  }
  // collect profiles to resolve
  let ids=[];
  if(v.name==="home") mySpaceIds().forEach(sid=>membersOf(sid).slice(0,5).forEach(m=>ids.push(m.uid)));
  else { membersOf(v.spaceId).forEach(m=>ids.push(m.uid)); if(v.name==="list") itemsOf(v.listId).forEach(i=>{i.addedBy&&ids.push(i.addedBy); i.assignee&&ids.push(i.assignee); (i.alsoBy||[]).forEach(a=>a&&a.uid&&ids.push(a.uid));});
    else S.pantry.forEach(p=>p.by&&ids.push(p.by)); }
  mySpaceIds().forEach(sid=>{const sh=shopperOf(S.spaces.get(sid)); if(sh) ids.push(sh.uid);});
  if(ids.length) await getProfiles(ids);
  if(t!==refreshToken) return;
  if(v.name==="home") paintHome(); else if(v.name==="space") paintSpace(); else paintList();
}
